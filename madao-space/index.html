<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>码道CodeArts Space · 交互原型 v1</title>
<style>
/* ============================================================
   码道 Desktop & Web 设计系统 v1.4 — Token 层
   组件只引用语义别名，不写死色值
   ============================================================ */
:root{
  --bg-100:#ffffff; --bg-200:#fafafa;
  --g-100:#f5f5f5; --g-200:#ebebeb; --g-300:#e0e0e0; --g-400:#d6d6d6; --g-500:#c2c2c2;
  --g-600:#a3a3a3; --g-700:#8f8f8f; --g-800:#6e6e6e; --g-900:#4d4d4d; --g-1000:#171717;
  --a-100:#0000000d; --a-200:#00000014; --a-300:#0000001a; --a-400:#00000024; --a-500:#00000036; --a-600:#0000004d;
  --p-100:#f6f2fe; --p-200:#efe9fd; --p-300:#e7dcfd; --p-400:#d6c4fa; --p-600:#834df0; --p-700:#6f3cd8; --p-800:#5b2fb4; --p-900:#4a2593;
  --gr-100:#eaf7ee; --gr-200:#dcf1e3; --gr-400:#a2d9b6; --gr-700:#17864a; --gr-800:#127040; --gr-900:#0e5c34;
  --am-100:#fff7e6; --am-200:#ffefcc; --am-400:#f5ce7a; --am-700:#a66300; --am-800:#8f5400; --am-900:#7a4500;
  --rd-100:#fef0f0; --rd-200:#fde3e4; --rd-400:#f5aeb2; --rd-700:#c41f2c; --rd-800:#a81826; --rd-900:#8e1420;
  --bl-100:#eef4ff; --bl-200:#dfeaff; --bl-400:#a5c4fa; --bl-700:#1a56c4; --bl-800:#14479f; --bl-900:#0f3a80;

  --surface-1:var(--bg-100); --surface-2:var(--bg-200); --page:#f2f2f2; --paper:#fafafa;
  --kb-col:rgba(0,0,0,.045); --kb-card:#ffffff;
  --heat-0:rgba(0,0,0,.05); --heat-1:#e7dcfd; --heat-2:#b694f5; --heat-3:#834df0; --heat-4:#5b2fb4;
  --seg-track:rgba(0,0,0,.055); --seg-track-bd:rgba(0,0,0,.07);
  --seg-chip:#ffffff; --seg-chip-bd:rgba(0,0,0,.10); --seg-chip-top:rgba(255,255,255,.9);
  --seg-chip-sh:0 1px 2px rgba(0,0,0,.09),0 1px 1px rgba(0,0,0,.05);
  --polaroid-frame:#ffffff; --polaroid-inner:#f0f0f0;
  --polaroid-shadow:rgba(23,16,48,.45) 0 10px 20px -10px,rgba(23,16,48,.1) 0 2px 4px 0;
  --scrim:rgba(0,0,0,.42);
  --surface-glass:rgba(255,255,255,.82); --glass-border:var(--a-200);
  --text-1:var(--g-1000); --text-2:var(--g-900); --text-3:var(--g-800); --text-dis:var(--g-700);
  --int-subtle:var(--a-100); --border-subtle:var(--a-200); --border-strong:var(--a-400);
  --control-border:var(--g-700); --focus:var(--g-1000);
  --brand:#834df0; --brand-soft:var(--p-100); --brand-border:var(--p-400);
  --brand-solid:var(--p-700); --brand-solid-hover:var(--p-800); --brand-on-soft:var(--p-900);
  --run-bg:var(--p-100); --run-bd:var(--p-400); --run-solid:var(--p-700); --run-tx:var(--p-900);
  --wait-bg:var(--am-100); --wait-bd:var(--am-400); --wait-solid:var(--am-700); --wait-tx:var(--am-900);
  --done-bg:var(--gr-100); --done-bd:var(--gr-400); --done-solid:var(--gr-700); --done-tx:var(--gr-900);
  --fail-bg:var(--rd-100); --fail-bd:var(--rd-400); --fail-solid:var(--rd-700); --fail-tx:var(--rd-900);
  --info-bg:var(--bl-100); --info-bd:var(--bl-400); --info-tx:var(--bl-900); --link:var(--bl-700);
  --icon-1:var(--g-900); --icon-2:var(--g-800); --icon-dis:var(--g-700); --icon-brand:var(--p-700);
  --on-fill:#ffffff;
  --syn-kw:var(--p-700); --syn-str:var(--gr-800); --syn-num:var(--am-800); --syn-cm:var(--g-800);
  --git-add:var(--gr-800); --git-mod:var(--am-800); --git-del:var(--rd-800); --git-un:var(--g-800);
  --f-source:var(--bl-700); --f-style:var(--p-700); --f-data:var(--am-700); --f-media:var(--gr-700); --f-doc:var(--g-800);
  --cat1-bg:var(--bl-100); --cat1-fg:var(--bl-900); --cat2-bg:var(--p-100); --cat2-fg:var(--p-900);
  --cat3-bg:var(--gr-100); --cat3-fg:var(--gr-900); --cat4-bg:var(--am-100); --cat4-fg:var(--am-900);
  --catn-bg:var(--g-200); --catn-fg:var(--g-900);
  --diff-add:var(--gr-100); --diff-del:var(--rd-100);
  --el-1:0 2px 2px rgba(0,0,0,.04);
  --el-2:0 1px 1px rgba(0,0,0,.02),0 4px 8px -4px rgba(0,0,0,.04),0 16px 24px -8px rgba(0,0,0,.06);
  --el-3:0 1px 1px rgba(0,0,0,.02),0 8px 16px -4px rgba(0,0,0,.04),0 24px 32px -8px rgba(0,0,0,.06);
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  --mo-state:150ms; --mo-pop:200ms; --mo-ov:280ms; --ease:cubic-bezier(.2,0,0,1);
  --sans:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei UI',sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg-100:#1c1c1c; --bg-200:#171717;
  --g-100:#212121; --g-200:#262626; --g-300:#2e2e2e; --g-400:#383838; --g-500:#454545;
  --g-600:#5c5c5c; --g-700:#7a7a7a; --g-800:#a1a1a1; --g-900:#c2c2c2; --g-1000:#f5f5f5;
  --a-100:#ffffff0d; --a-200:#ffffff14; --a-300:#ffffff1a; --a-400:#ffffff24; --a-500:#ffffff36; --a-600:#ffffff4d;
  --p-100:#1e1430; --p-200:#261a3c; --p-300:#2f2049; --p-400:#3d2a5e; --p-600:#834df0; --p-700:#7b45e5; --p-800:#8f61ea; --p-900:#c4a9fb;
  --gr-100:#0e2318; --gr-200:#133020; --gr-400:#22553a; --gr-700:#4fc183; --gr-800:#66d097; --gr-900:#8fe3b4;
  --am-100:#2a1c08; --am-200:#38260c; --am-400:#5f4218; --am-700:#e0a03a; --am-800:#f0b45c; --am-900:#f5c67f;
  --rd-100:#2c1214; --rd-200:#3b181b; --rd-400:#63292e; --rd-700:#e05a66; --rd-800:#ee7a83; --rd-900:#f49ba1;
  --bl-100:#0e1a2e; --bl-200:#13233c; --bl-400:#1f3c66; --bl-700:#4a8ae8; --bl-800:#6ba3f0; --bl-900:#9cc4f8;
  --surface-glass:rgba(28,28,28,.82); --glass-border:var(--a-300); --page:#101010; --paper:#212121;
  --kb-col:rgba(0,0,0,.26); --kb-card:#262626;
  --heat-0:rgba(255,255,255,.055); --heat-1:#3d2a5e; --heat-2:#533b7d; --heat-3:#7b45e5; --heat-4:#c4a9fb;
  --seg-track:rgba(0,0,0,.38); --seg-track-bd:rgba(255,255,255,.06);
  --seg-chip:#323232; --seg-chip-bd:rgba(255,255,255,.11); --seg-chip-top:rgba(255,255,255,.08);
  --seg-chip-sh:0 1px 2px rgba(0,0,0,.4);
  --polaroid-frame:#2e2e2e; --polaroid-inner:#383838;
  --polaroid-shadow:rgba(0,0,0,.55) 0 10px 20px -8px,rgba(0,0,0,.35) 0 2px 4px 0;
  --scrim:rgba(0,0,0,.68);
  --brand-solid-hover:var(--p-600);
  --syn-kw:var(--p-900); --syn-str:var(--gr-900); --syn-num:var(--am-900); --syn-cm:var(--g-800);
  --git-add:var(--gr-900); --git-mod:var(--am-900); --git-del:var(--rd-900);
  --f-source:var(--bl-800); --f-style:var(--p-900); --f-data:var(--am-800); --f-media:var(--gr-800);
  --icon-brand:var(--p-900); --link:var(--bl-800);
  --el-1:0 2px 2px rgba(0,0,0,.32);
  --el-2:0 1px 1px rgba(0,0,0,.24),0 4px 8px -4px rgba(0,0,0,.4),0 16px 24px -8px rgba(0,0,0,.48);
  --el-3:0 1px 1px rgba(0,0,0,.24),0 8px 16px -4px rgba(0,0,0,.4),0 24px 32px -8px rgba(0,0,0,.56);
}

/* ===================== Reset & 基础排版 ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text-1);font-family:var(--sans);
  font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
::selection{background:var(--p-300);color:var(--text-1)}
.mono{font-family:var(--mono)}
.t-h20{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.3px}
.t-h16{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.16px}
.t-h14{font-size:14px;line-height:20px;font-weight:600}
.t-13{font-size:13px;line-height:20px}
.t-12{font-size:12px;line-height:16px}
.t-11{font-size:11px;line-height:14px;font-weight:500;font-family:Inter,-apple-system,sans-serif}
.sec{color:var(--text-2)} .ter{color:var(--text-3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--a-400) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--a-400);border-radius:var(--r-full);border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ===================== 外壳 ===================== */
.app{height:100vh;display:flex;flex-direction:column;background:var(--page)}
/* ---- 液态玻璃：只用于浮层性质的表面（标题栏、吸顶条、动作条、浮层） ---- */
.glass{background:var(--surface-glass);backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 var(--a-200)}
/* ---- Bento：每个功能域是一块独立的、带圆角的板 ---- */
.panel{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg)}
/* ---- 可拖动分隔条：占住 bento 的间隙，拖动时只改 DOM 宽度不触发重渲染 ---- */
.rz{flex:0 0 8px;width:8px;position:relative;cursor:col-resize;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.rz::after{content:"";width:2px;height:28px;border-radius:2px;background:transparent;
  transition:background var(--mo-state) var(--ease),height var(--mo-state) var(--ease)}
.rz:hover::after,.rz.dragging::after{background:var(--g-700);height:56px}
.rz.dragging{cursor:col-resize}
body.rzing{cursor:col-resize;user-select:none}
body.rzing *{cursor:col-resize!important}
/* 自绘标题栏 44px */
.titlebar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:transparent;position:relative;z-index:10;user-select:none}
.traffic{display:flex;gap:8px;padding-right:4px}
.traffic i{width:12px;height:12px;border-radius:var(--r-full);display:block}
.tb-space{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--r-sm);
  transition:background var(--mo-state) var(--ease)}
.tb-space:hover{background:var(--int-subtle)}
.tb-logo{width:20px;height:20px;border-radius:var(--r-sm);flex:0 0 20px;display:block;object-fit:contain}
.tb-search{flex:1;max-width:520px;margin:0 auto;height:28px;display:flex;align-items:center;gap:8px;
  padding:0 10px;border-radius:var(--r-sm);background:var(--a-100);color:var(--text-3);
  border:1px solid transparent;transition:all var(--mo-state) var(--ease)}
.tb-search:hover{border-color:var(--border-strong)}
.tb-right{display:flex;align-items:center;gap:4px;margin-left:auto}
.ide-btn{height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 10px;
  border-radius:var(--r-sm);background:var(--a-100);color:var(--text-1);
  font-size:13px;line-height:18px;font-weight:500;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px var(--border-subtle);transition:all var(--mo-state) var(--ease)}
.ide-btn:hover{background:var(--a-200);box-shadow:inset 0 0 0 1px var(--border-strong)}
.ide-btn svg{color:var(--icon-2)}
.ide-btn:hover svg{color:var(--text-1)}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--a-200);color:var(--text-3)}

.shell-body{flex:1;display:flex;min-height:0;padding:0 8px 8px}

/* ===================== 全局导航 ===================== */
.rail{flex:0 0 232px;width:232px;background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);
  display:flex;flex-direction:column;transition:width var(--mo-pop) var(--ease),flex-basis var(--mo-pop) var(--ease)}
.rail.collapsed{flex-basis:64px;width:64px}
.rail-top{padding:12px 12px 2px}
.rail.collapsed .rail-top{padding:12px 8px 8px}
.modesw{display:flex;gap:2px;padding:3px;background:var(--seg-track);border-radius:var(--r-lg);margin-bottom:8px;
  box-shadow:inset 0 0 0 1px var(--seg-track-bd)}
.modesw button{flex:1;height:30px;border-radius:9px;font-size:13px;color:var(--text-3);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all var(--mo-state) var(--ease)}
.modesw button:hover{color:var(--text-1)}
.modesw button.on{background:var(--seg-chip);color:var(--text-1);font-weight:500;
  box-shadow:var(--seg-chip-sh),inset 0 0 0 1px var(--seg-chip-bd),inset 0 1px 0 var(--seg-chip-top)}
.modesw.mini{flex-direction:column}
.modesw.mini button span{display:none}
.btn-new{width:100%;height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;
  border-radius:var(--r-sm);color:var(--text-2);font-size:13px;
  transition:background var(--mo-state) var(--ease),color var(--mo-state) var(--ease)}
.btn-new svg{flex:0 0 16px;color:var(--icon-2)}
.btn-new:hover{background:var(--int-subtle);color:var(--text-1)}
.btn-new:hover svg{color:var(--text-1)}
.rail.collapsed .btn-new{justify-content:center;padding:0}
.rail.collapsed .btn-new span{display:none}
.rail-nav{flex:1;padding:4px 8px;overflow-y:auto;overflow-x:hidden;border-radius:0 0 var(--r-lg) var(--r-lg)}
.nav-group{margin-top:12px}
.nav-label{font-size:11px;font-weight:500;color:var(--text-3);padding:6px 10px 4px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.rail.collapsed .nav-label{opacity:0;height:8px;padding:0;overflow:hidden}
.nav-item{width:100%;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:13px;transition:background var(--mo-state) var(--ease),color var(--mo-state) var(--ease);position:relative}
.nav-item:hover{background:var(--int-subtle);color:var(--text-1)}
.nav-item.on{background:var(--a-200);color:var(--text-1);font-weight:500}
.nav-item.on svg{color:var(--text-1)}
.nav-item svg{flex:0 0 16px;color:var(--icon-2)}
.nav-item .nm{flex:1;text-align:left;white-space:nowrap;overflow:hidden}
.nav-item .dot{width:6px;height:6px;border-radius:var(--r-full);background:var(--p-700);flex:0 0 6px}
.rail.collapsed .nav-item{justify-content:center;padding:0}
.rail.collapsed .nav-item .nm{display:none}
.rail.collapsed .nav-item .dot{position:absolute;top:5px;right:12px}
.nav-sub{width:100%;display:flex;align-items:center;gap:8px;padding:0 10px 0 28px;height:30px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:12px;transition:background var(--mo-state) var(--ease);text-align:left}
.nav-sub:hover{background:var(--int-subtle);color:var(--text-1)}
.nav-sub.on{background:var(--a-200);color:var(--text-1);font-weight:500}
.nav-sub .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sub .sd{width:6px;height:6px;border-radius:var(--r-full);flex:0 0 6px}
.rail.collapsed .nav-sub{display:none}
.nav-label .lk{font-size:11px;font-weight:400;color:var(--text-3);text-transform:none;letter-spacing:0;
  padding:2px 4px;margin-right:-4px;border-radius:var(--r-sm);transition:color var(--mo-state) var(--ease),background var(--mo-state) var(--ease)}
.nav-label .lk:hover{color:var(--text-1);background:var(--int-subtle)}
.nav-label .lk:hover{color:var(--text-1)}
.rail-foot{padding:8px;border-top:1px solid var(--border-subtle)}
/* ---- 个人中心：常驻侧栏底部，面板向上弹出 ---- */
.acct-wrap{position:relative;margin-top:6px;padding-top:6px;border-top:1px solid var(--border-subtle)}
.acct{width:100%;display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-md);
  transition:background var(--mo-state) var(--ease);text-align:left}
.acct:hover{background:var(--int-subtle)}
.acct-t{flex:1;min-width:0;display:flex;flex-direction:column}
.acct-n{font-size:13px;line-height:18px;font-weight:500;color:var(--text-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-p{font-size:11px;line-height:15px;color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail.collapsed .acct{justify-content:center;padding:6px 0}
.rail.collapsed .acct-t,.rail.collapsed .acct>svg{display:none}
.acctp{position:absolute;left:0;right:auto;width:280px;bottom:calc(100% + 8px);z-index:40;
  background:var(--surface-glass);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:var(--r-lg);
  box-shadow:var(--el-3),inset 0 1px 0 var(--a-300);padding:14px;
  animation:pop var(--mo-pop) var(--ease)}
.rail.collapsed .acctp{left:calc(100% + 8px);bottom:0}
.acctp-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.usage{background:var(--a-100);border:1px solid var(--border-subtle);border-radius:var(--r-md);
  padding:10px 11px;margin-bottom:12px}
.usage-r{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.acct-row{width:100%;display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;
  border-radius:var(--r-sm);font-size:13px;color:var(--text-2);
  transition:background var(--mo-state) var(--ease)}
.acct-row:hover{background:var(--int-subtle);color:var(--text-1)}
.acct-row .lbl{flex:1;text-align:left}
.acct-row .val{font-size:12px;color:var(--text-3)}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  background:var(--g-1000);color:var(--bg-100);font-size:12px;line-height:16px;padding:6px 8px;border-radius:var(--r-sm);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--mo-state) var(--ease) 400ms;z-index:40}
.rail:not(.collapsed) .tip::after{display:none}
.tip:hover::after{opacity:1}

/* ===================== 通用组件 ===================== */
.chip{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--r-full);
  font-size:12px;line-height:16px;white-space:nowrap;
  background:var(--a-100);border:1px solid var(--border-subtle);color:var(--text-2)}
.chip .d{width:6px;height:6px;border-radius:var(--r-full);flex:0 0 6px;background:var(--text-dis)}
.chip.run .d{background:var(--run-solid);animation:breathe 1.6s var(--ease) infinite}
.chip.wait .d{background:var(--wait-solid)}
.chip.done .d{background:var(--done-solid)}
.chip.info .d{background:var(--link)}
/* 唯一保留色底的状态：失败必须一眼看见 */
.chip.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail-tx)}
.chip.fail .d{background:var(--fail-solid)}
.chip.btn{height:28px;cursor:pointer;transition:filter var(--mo-state) var(--ease)}
.chip.btn:hover{filter:brightness(.97)}
[data-theme="dark"] .chip.btn:hover{filter:brightness(1.18)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.chip.run .d{animation:none}}

.tag{height:22px;display:inline-flex;align-items:center;gap:5px;padding:0 8px;border-radius:var(--r-sm);
  background:var(--int-subtle);color:var(--text-2);font-size:12px;line-height:16px;white-space:nowrap}
.tag.mono{font-family:var(--mono);font-size:11px}
.btn{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;
  border-radius:var(--r-sm);font-size:14px;font-weight:500;transition:all var(--mo-state) var(--ease)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;line-height:18px}
.btn.pri{background:var(--g-1000);color:var(--bg-100)}
.btn.pri:hover{background:var(--g-900)}
.btn.acc{background:var(--g-1000);color:var(--bg-100)}
.btn.acc:hover{background:var(--g-900)}
.btn.acc:active{background:var(--g-800)}
.btn.sec{background:var(--surface-1);color:var(--text-1);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn.sec:hover{background:var(--int-subtle);box-shadow:inset 0 0 0 1px var(--a-500)}
.btn.ter{color:var(--text-2)}
.btn.ter:hover{background:var(--int-subtle);color:var(--text-1)}
.btn.des{background:var(--fail-solid);color:var(--on-fill)}
.btn:disabled{background:var(--g-100);color:var(--text-dis);box-shadow:none;cursor:not-allowed}
.iconbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--icon-1);
  transition:background var(--mo-state) var(--ease)}
.iconbtn:hover{background:var(--int-subtle)}

/* ── 左侧导航图标：hover 时按各自语义动一下 ──────────────────
   每条动画都回到初始形态（spark/plus 四向对称，转 90° 等于没转；
   clock 转满 360°），这样动画结束、鼠标仍在上面时不会「弹回去」。 */
.rail .ico{transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .rail .nav-item:hover .i-spark,
  .rail .btn-new:hover .i-plus{animation:ic-spark .55s var(--ease)}
  .rail .nav-item:hover .i-board{animation:ic-board .5s var(--ease)}
  .rail .nav-item:hover .i-folder{animation:ic-folder .45s var(--ease)}
  .rail .nav-item:hover .i-clock{animation:ic-clock .8s var(--ease)}
  .rail .nav-item:hover .i-pr{animation:ic-pr .55s var(--ease)}
  .rail .modesw button:hover .i-doc{animation:ic-folder .45s var(--ease)}
  .rail .modesw button:hover .i-code{animation:ic-code .5s var(--ease)}
}
/* 四角星：转 90° + 微微涨一下 */
@keyframes ic-spark{0%{transform:rotate(0) scale(1)}50%{transform:rotate(52deg) scale(1.22)}100%{transform:rotate(90deg) scale(1)}}
/* 看板：像列被依次推了一下 */
@keyframes ic-board{0%,100%{transform:scaleX(1)}35%{transform:scaleX(.82)}70%{transform:scaleX(1.06)}}
/* 文件夹：抬一下再落回，像被掀开 */
@keyframes ic-folder{0%,100%{transform:translateY(0)}40%{transform:translateY(-2.5px)}}
/* 时钟：走一整圈 */
@keyframes ic-clock{to{transform:rotate(360deg)}}
/* 合入：沿分支方向推一下 */
@keyframes ic-pr{0%,100%{transform:translateX(0)}35%{transform:translateX(-2px)}70%{transform:translateX(1.5px)}}
/* 尖括号：左右撑开再收回 */
@keyframes ic-code{0%,100%{transform:scaleX(1)}45%{transform:scaleX(1.25)}}

.seg{display:inline-flex;padding:3px;background:var(--seg-track);border-radius:var(--r-lg);gap:2px;
  box-shadow:inset 0 0 0 1px var(--seg-track-bd)}
.seg button{height:28px;padding:0 13px;border-radius:9px;font-size:13px;line-height:18px;color:var(--text-3);
  display:inline-flex;align-items:center;gap:6px;transition:all var(--mo-state) var(--ease)}
.seg button:hover{color:var(--text-1)}
.seg button.on{background:var(--seg-chip);color:var(--text-1);font-weight:500;
  box-shadow:var(--seg-chip-sh),inset 0 0 0 1px var(--seg-chip-bd),inset 0 1px 0 var(--seg-chip-top)}
.av{border-radius:var(--r-full);display:grid;place-items:center;font-weight:500;flex:0 0 auto;
  background:var(--catn-bg);color:var(--catn-fg);font-size:11px;width:24px;height:24px;
  box-shadow:0 0 0 2px var(--surface-1)}
.av.c1{background:var(--cat1-bg);color:var(--cat1-fg)} .av.c2{background:var(--cat2-bg);color:var(--cat2-fg)}
.av.c3{background:var(--cat3-bg);color:var(--cat3-fg)} .av.c4{background:var(--cat4-bg);color:var(--cat4-fg)}
img.av{object-fit:cover;background:var(--catn-bg);display:block}
/* 人用真人头像、Agent 用形象头像；人的头像多一圈描边，扫视时一眼分得开 */
img.av.me{box-shadow:0 0 0 2px var(--surface-1),0 0 0 3px var(--border-strong)}
.numbadge{width:24px;height:24px;border-radius:var(--r-full);display:grid;place-items:center;flex:0 0 auto;
  font-size:11px;font-weight:600;background:var(--catn-bg);color:var(--catn-fg)}
.numbadge.c1{background:var(--cat1-bg);color:var(--cat1-fg)} .numbadge.c2{background:var(--cat2-bg);color:var(--cat2-fg)}
.numbadge.c3{background:var(--cat3-bg);color:var(--cat3-fg)} .numbadge.c4{background:var(--cat4-bg);color:var(--cat4-fg)}
.avs{display:flex}.avs .av+.av{margin-left:-6px}
.card{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg)}
.ecard2,.entry,.tile{border-radius:var(--r-xl)}
.prog{height:4px;border-radius:var(--r-full);background:var(--g-200);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand-solid);border-radius:var(--r-full)}

/* ===================== 页面骨架 ===================== */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
/* 三域页面：stage 退为透明容器，三块各自成板 */
.stage:has(.three){background:transparent;border:0;border-radius:0;overflow:visible}
.phead{flex:0 0 auto;padding:20px 24px 0;display:flex;flex-direction:column;gap:16px}
.phead-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead-row .sp{flex:1}
.pbody{flex:1;min-height:0;padding:16px 24px 24px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--text-2)}
.crumb .cur{color:var(--text-1)}
.crumb .sepr{color:var(--icon-2)}

/* ===== 个人工作台 ===== */
.wb{padding:0 24px 56px}
.wb-hero{max-width:1080px;margin:0 auto;padding:44px 0 8px;text-align:center}
.wb-hi{margin:0;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.64px}
.wb-sub{margin:8px 0 22px;font-size:14px;line-height:22px;color:var(--text-3)}
.wb-sub b{color:var(--text-1);font-weight:600}
/* 包围结构：外层浅底托住内层输入卡，底部信息条落在外层上 */
.wb-shell{text-align:left;background:var(--a-100);border:1px solid var(--border-subtle);
  border-radius:var(--r-xl);padding:5px 5px 0;transition:border-color var(--mo-state) var(--ease)}
.wb-shell:focus-within{border-color:var(--border-strong)}
.wb-box{position:relative;text-align:left;border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  background:var(--surface-1);box-shadow:var(--el-1);transition:border-color var(--mo-state) var(--ease)}
.wb-box:focus-within{border-color:var(--border-strong)}
.wb-foot{display:flex;align-items:center;gap:8px;padding:9px 12px 10px;
  font-size:11px;line-height:16px;color:var(--text-3)}
.wb-foot span{display:inline-flex;align-items:center;gap:5px}
.wb-box:focus-within{border-color:var(--focus)}
.wb-box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;
  font-family:var(--sans);font-size:15px;line-height:24px;padding:16px 18px 4px;min-height:72px}
.wb-box textarea::placeholder{color:var(--text-dis)}
.wb-box-f{display:flex;align-items:center;gap:6px;padding:6px 10px 10px;flex-wrap:wrap}
/* 发送键：无输入时置灰不可点，有输入才亮起 */
.wb-send{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:var(--r-md);
  background:var(--g-1000);color:var(--bg-100);
  transition:background var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.wb-send:hover:not(:disabled){background:var(--g-900);transform:translateY(-1px)}
.wb-send:active:not(:disabled){transform:none}
.wb-send:disabled{background:var(--a-200);color:var(--text-dis);cursor:not-allowed;transform:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.qpill{height:34px;padding:0 14px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:7px;
  font-size:13px;color:var(--text-2);background:var(--surface-1);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  transition:all var(--mo-state) var(--ease)}
.qpill:hover{color:var(--text-1);box-shadow:inset 0 0 0 1px var(--border-strong);transform:translateY(-1px)}
.qpill svg{color:var(--icon-2)}
.qpill:hover svg{color:var(--text-1)}
.qpill.icon{padding:0;width:34px;justify-content:center}
.wb-sec{max-width:1080px;margin:0 auto;padding-top:36px}
.wb-entry{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r-xl);
  transition:border-color var(--mo-state) var(--ease),background var(--mo-state) var(--ease)}
.wb-entry:hover{border-color:var(--border-strong);background:var(--a-100)}
.wb-sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
/* 概览与日历并排：左指标 2×2，右日历 */
.wb-row{max-width:1080px;margin:0 auto;padding-top:36px;display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:1100px){.wb-row{grid-template-columns:1fr}}
.wb-col{min-width:0;display:flex;flex-direction:column}
.wb-col .statgrid{flex:1}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat-b{display:flex;align-items:flex-end;gap:10px;margin-top:2px}
.stat-b>div{flex:1;min-width:0}
.spark{width:76px;height:26px;flex:0 0 76px;margin-bottom:3px;overflow:visible}
.statcard{background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:14px 16px}
.stat-h{display:flex;align-items:center;gap:8px;min-height:28px}
.stat-dot{width:7px;height:7px;border-radius:var(--r-full);flex:0 0 7px}
.stat-h .btn{opacity:0;transition:opacity var(--mo-state) var(--ease)}
.statcard:hover .btn{opacity:1}
.stat-v{font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.6px;margin:2px 0 1px;
  font-variant-numeric:tabular-nums}

/* 活跃日历 */
.heat-col-wrap .heat-wrap{padding:14px;flex:1;display:flex;flex-direction:column}
.heat-wrap{padding:16px}
.heat-scroll{overflow:visible}
.heat-grid{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:16px auto;gap:5px 6px}
.heat-months{grid-column:2;grid-row:1;display:flex;gap:3px;font-size:11px;line-height:16px;color:var(--text-3)}
.heat-months span{flex:1 1 0;min-width:0;white-space:nowrap}
.heat-dows{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,1fr);gap:3px;
  font-size:10px;line-height:1;color:var(--text-3);text-align:right}
.heat-dows span{display:flex;align-items:center;justify-content:flex-end}
.heat-cols{grid-column:2;grid-row:2;display:flex;gap:3px;min-width:0}
.heat-col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;flex:1 1 0;min-width:0}
.heat-cell{width:100%;aspect-ratio:1;border-radius:2px;display:block;
  box-shadow:inset 0 0 0 1px var(--a-200);transition:transform var(--mo-state) var(--ease)}
.heat-col .heat-cell:hover{transform:scale(1.25)}
.heat-legend{display:flex;align-items:center;gap:4px}
.heat-legend .heat-cell{width:11px;height:11px;flex:0 0 11px;aspect-ratio:auto}
.heat-foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;
  border-top:1px solid var(--border-subtle);font-size:12px;line-height:18px;color:var(--text-3);flex-wrap:wrap}
.heat-foot b{color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.sepdot{opacity:.5}

/* 交付分析 */
.anarow{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:1000px){.anarow{grid-template-columns:1fr}}
.anacard{padding:16px;display:flex;flex-direction:column}
.ana-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ana-h .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3)}
.ana-h .lg i{width:6px;height:6px;border-radius:1px;display:block}
.ana-h .lg i.dash{width:5px;height:5px;opacity:.6}
.trend{width:100%;height:auto;flex:1;min-height:150px}
.trend .ax{font-size:9px;fill:var(--text-3);font-family:var(--mono)}
.donut-row{display:flex;align-items:center;gap:14px;flex:1}
.donut{width:124px;height:124px;flex:0 0 124px}
.donut-v{font-size:26px;font-weight:600;fill:var(--text-1);font-family:var(--sans)}
.donut-l{font-size:10px;fill:var(--text-3);font-family:var(--sans)}
.donut-legend{flex:1;min-width:0}
.lgrow{display:flex;align-items:center;gap:7px;font-size:12px;line-height:22px}
.lgrow i{width:8px;height:8px;border-radius:1px;flex:0 0 8px}
.lgrow .lgn{flex:1;color:var(--text-2)}
.lgrow b{font-variant-numeric:tabular-nums}
.lgrow .lgp{width:34px;text-align:right;color:var(--text-3);font-family:var(--mono);font-size:11px}
.kv{display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:21px;color:var(--text-3)}
.kv b{color:var(--text-1);font-variant-numeric:tabular-nums}

/* 工作台内的看板：跟随页面滚动，不再自己占满高度 */
.wb-board .kb{height:auto;overflow-x:visible}
.wb-board .kb-col{max-height:none;min-width:0}
.wb-board .kb-b{overflow:visible}
.wb-board .graphwrap{height:auto}
.wb-board .tbl thead th{top:-1px}

/* ===== 看板 · 泳道视图 ===== */
.kb{display:flex;gap:14px;height:100%;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.kb-col{flex:1 1 0;min-width:268px;display:flex;flex-direction:column;background:var(--kb-col);
  border:1px solid var(--border-subtle);border-radius:var(--r-xl);max-height:100%}
.kb-h{flex:0 0 auto;padding:12px 14px 2px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;background:var(--kb-col);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:10}
.kb-h .nm{font-size:13px;line-height:18px;font-weight:600;flex:1}
.kb-h .ct{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.kb-tick{width:3px;height:15px;border-radius:2px;flex:0 0 3px}
.kb-b{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.kb-card{background:var(--kb-card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:13px;
  cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.kb-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.kb-card .kt{font-size:13px;line-height:19px;font-weight:600;display:flex;gap:7px;align-items:flex-start}
.kb-card .kt .tx{flex:1}
.kb-card .kn{font-size:12px;line-height:18px;color:var(--text-3)}
.kb-card .kf{display:flex;align-items:center;gap:8px}
.kb-empty{padding:20px 12px;text-align:center;color:var(--text-dis);font-size:12px;
  border:1px dashed var(--border-subtle);border-radius:var(--r-md)}

/* ===== 看板 · 列表视图 ===== */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl thead th{position:sticky;top:0;z-index:10;background:var(--surface-1);text-align:left;
  font-size:12px;line-height:16px;font-weight:500;color:var(--text-3);padding:8px 12px;
  border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.tbl tbody tr{cursor:pointer;transition:background var(--mo-state) var(--ease)}
.tbl tbody tr:hover{background:var(--int-subtle)}
.tbl tbody td{padding:10px 12px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl .tname{font-size:14px;line-height:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.tbl .tsub{font-size:12px;line-height:16px;color:var(--text-3);margin-top:2px;display:flex;align-items:center;gap:6px}
.kindico{width:18px;height:18px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 18px}
.kindico.code,.kindico.gen{background:var(--a-100);color:var(--icon-2)}
.branch{font-family:var(--mono);font-size:11px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.nextbtn{opacity:0;transition:opacity var(--mo-state) var(--ease)}
tr:hover .nextbtn{opacity:1}

/* ===== 看板 · 网格视图（并行监看） ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;overflow:hidden;min-height:228px;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease);cursor:pointer}
.tile:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.tile-h{padding:12px 14px;display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--border-subtle)}
.tile-b{flex:1;padding:10px 14px;background:var(--surface-2);font-family:var(--mono);font-size:12px;line-height:18px;
  color:var(--text-3);overflow:hidden;position:relative}
.tile-b .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-b .ln.hi{color:var(--text-1)}
.tile-b::after{content:"";position:absolute;inset:auto 0 0 0;height:28px;
  background:linear-gradient(to bottom,transparent,var(--surface-2))}
.tile-f{padding:10px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border-subtle)}

/* ===== 看板 · 依赖图 ===== */
.graphwrap{display:flex;gap:24px;height:100%}
.graph{flex:0 0 520px;padding:8px 0}
.gnode{display:flex;gap:12px;align-items:stretch;position:relative}
.gcol{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;position:relative}
.gcol .line{flex:1;width:2px;background:var(--g-300)}
.gcol .knot{width:14px;height:14px;border-radius:var(--r-full);border:2px solid var(--surface-1);flex:0 0 14px;margin:4px 0;z-index:1}
.knot.run{background:var(--run-solid)} .knot.wait{background:var(--wait-solid)}
.knot.done{background:var(--done-solid)} .knot.fail{background:var(--fail-solid)}
.gcard{flex:1;margin-bottom:12px;padding:12px 14px;cursor:pointer;transition:border-color var(--mo-state) var(--ease)}
.gcard:hover{border-color:var(--border-strong)}
.gcard.child{margin-left:32px}
.risk{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:14px;font-weight:500;
  padding:2px 7px;border-radius:var(--r-full)}
.risk.hi{background:var(--fail-bg);color:var(--fail-tx)}
.risk.mid{background:var(--wait-bg);color:var(--wait-tx)}
.risk.lo{background:var(--done-bg);color:var(--done-tx)}
.legend{flex:1;padding:16px;background:var(--surface-2);border-radius:var(--r-lg);align-self:flex-start;max-width:380px}

/* ===================== 三域工作台 ===================== */
.three{flex:1;display:flex;min-height:0}
/* 左 · 任务记录域 */
.dom-l{flex:0 0 296px;width:296px;display:flex;flex-direction:column;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
.dom-l-h{padding:12px;border-bottom:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:10px}
.srch{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r-sm);
  background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-3);font-size:13px}
.mini{width:100%;text-align:left;padding:10px;border-radius:var(--r-md);display:flex;flex-direction:column;gap:6px;
  transition:background var(--mo-state) var(--ease);border:1px solid transparent}
.mini:hover{background:var(--int-subtle)}
.mini.on{background:var(--a-200);border-color:var(--border-strong)}
.mini.on .mtitle{color:var(--text-1)}
.mtitle{font-size:13px;line-height:18px;font-weight:500;display:flex;gap:7px;align-items:flex-start}
.mtitle .tx{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mmeta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);padding-left:25px}

/* 中 · 任务控制域 */
.dom-c{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
.dom-c-h{flex:0 0 auto;padding:12px 20px;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;background:var(--surface-glass);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--a-200);position:sticky;top:0;z-index:10}
.stream{flex:1;padding:20px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;max-width:820px}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:13px;line-height:18px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.msg .who .ts{font-weight:400;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.msg .txt{font-size:14px;line-height:22px;color:var(--text-2)}
.msg.me .txt{color:var(--text-1)}

/* ===== 对话流执行过程：叙述 + 可折叠工具组 + 子 Agent 行 ===== */
.flow{max-width:820px;display:flex;flex-direction:column;gap:14px}
.fsay{font-size:14px;line-height:23px;color:var(--text-1)}
.fthink{font-size:13px;line-height:21px;color:var(--text-3);padding-left:12px;
  border-left:2px solid var(--border-subtle);font-style:italic}
.fgrp-h{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 6px;
  border-radius:var(--r-sm);border:1px solid var(--border-subtle);background:var(--surface-1);
  font-size:13px;color:var(--text-3);transition:all var(--mo-state) var(--ease);align-self:flex-start}
.fgrp-h:hover{color:var(--text-1);border-color:var(--border-strong)}
.fgrp-h svg{transition:transform var(--mo-state) var(--ease)}
.fgrp-h.on svg{transform:rotate(90deg)}
.fgrp-b{margin:8px 0 0 13px;padding-left:18px;border-left:1px solid var(--border-subtle);
  display:flex;flex-direction:column;gap:9px}
.fitem{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--text-2);flex-wrap:wrap}
.fitem .ok{color:var(--done-solid);display:flex;flex:0 0 15px}
.fitem .nm{font-weight:500;color:var(--text-1)}
.fcode{font-family:var(--mono);font-size:12px;line-height:18px;color:var(--text-2);
  background:var(--a-100);border:1px solid var(--border-subtle);border-radius:4px;padding:1px 7px}
.fsub{display:flex;align-items:center;gap:10px;font-size:13px;line-height:20px;color:var(--text-2)}
.orb{width:22px;height:22px;border-radius:var(--r-full);flex:0 0 22px;
  box-shadow:inset 0 0 0 1px var(--a-300),0 1px 3px var(--a-300)}
.orb.c1{background:radial-gradient(circle at 32% 28%,#ffd9a8,#e8834f 55%,#b8492d)}
.orb.c2{background:radial-gradient(circle at 32% 28%,#f5b8e8,#c05ad8 55%,#6c2fa8)}
.orb.c3{background:radial-gradient(circle at 32% 28%,#b8e8d0,#4aa87a 55%,#1f6b4a)}
.orb.c4{background:radial-gradient(circle at 32% 28%,#ffe3a8,#e0a03a 55%,#a66300)}
.orb.run{animation:orbspin 2.4s linear infinite}
@keyframes orbspin{to{filter:hue-rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.orb.run{animation:none}}
.fsub .sep{color:var(--text-dis)}
.fsub .st{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* 阶段时间线 */
.tl{border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden;max-width:820px}
.tl-h{padding:10px 14px;display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border-bottom:1px solid var(--border-subtle);cursor:pointer}
.tl-b{padding:6px 14px 12px}
.stage-row{display:flex;gap:12px;padding:7px 0;align-items:flex-start}
.stage-ico{width:16px;height:16px;border-radius:var(--r-full);flex:0 0 16px;margin-top:3px;display:grid;place-items:center;
  font-size:10px;font-family:var(--mono)}
.stage-ico.done{background:var(--done-bg);color:var(--done-tx);border:1px solid var(--done-bd)}
.stage-ico.run{background:var(--run-bg);color:var(--run-tx);border:1px solid var(--run-bd)}
.stage-ico.pend{background:var(--g-100);color:var(--text-dis);border:1px solid var(--border-subtle)}
.stage-ico.fail{background:var(--fail-bg);color:var(--fail-tx);border:1px solid var(--fail-bd)}
.stage-tx{flex:1;font-size:13px;line-height:20px}
.stage-tx .sub{font-size:12px;line-height:16px;color:var(--text-3);margin-top:1px}

/* 介入卡 */
.icard{max-width:820px;background:var(--surface-1);border-radius:var(--r-lg);box-shadow:var(--el-1);
  border:1px solid var(--wait-bd);overflow:hidden}
.icard.fail{border-color:var(--fail-bd)}
.icard-h{padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.icard-b{padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px}
.icard-q{font-size:15px;line-height:24px;font-weight:600}
.scope{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--text-3);padding:8px 10px;
  background:var(--surface-2);border-radius:var(--r-md);border:1px solid var(--border-subtle)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-md);border:1px solid var(--border-strong);
  background:var(--surface-1);transition:all var(--mo-state) var(--ease);display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--border-strong);background:var(--a-100)}
.opt .rad{width:16px;height:16px;border-radius:var(--r-full);border:1px solid var(--control-border);flex:0 0 16px;margin-top:2px}
.opt:hover .rad{border-color:var(--text-1);box-shadow:inset 0 0 0 3px var(--text-1)}
.opt .ot{font-size:13px;line-height:20px;font-weight:500}
.opt .od{font-size:12px;line-height:18px;color:var(--text-3);margin-top:1px}
.icard-f{display:flex;gap:8px;align-items:center;padding-top:2px}

/* 输入区 + 任务概览停靠 */
.composer{flex:0 0 auto;padding:0 20px 16px;background:var(--surface-1)}
.ovbar{max-width:820px;display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:-1px;
  background:var(--surface-glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--a-200);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg) var(--r-lg) 0 0;flex-wrap:wrap}
.ovbar .sp{flex:1}
.cbox{max-width:820px;border:1px solid var(--border-strong);border-radius:0 0 var(--r-lg) var(--r-lg);
  background:var(--surface-1);padding:10px 12px;display:flex;flex-direction:column;gap:8px;
  transition:border-color var(--mo-state) var(--ease)}
.cbox:focus-within{border-color:var(--focus)}
.cbox textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:22px;
  min-height:44px;font-family:var(--sans)}
.cbox textarea::placeholder{color:var(--text-dis)}
.cbox-f{display:flex;align-items:center;gap:6px}
.cbox-f .sp{flex:1}
.pick{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:var(--r-sm);
  font-size:12px;color:var(--text-2);transition:background var(--mo-state) var(--ease)}
.pick:hover{background:var(--int-subtle);color:var(--text-1)}

/* 右 · 工作对象域 */
.dom-r{flex:0 1 640px;width:640px;min-width:360px;display:flex;flex-direction:column;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
.dom-r.hidden{display:none}
/* 任务页只剩控制域 + 产物域两列 */
.three.two .dom-c{min-width:400px}
/* 左域收起：整列与其分隔条一起退场 */
.three.lhide .dom-l,.three.lhide>.rz[data-rz="domLW"]{display:none}
/* 右域全屏：中间与左侧让位，产物面板接管整块工作区 */
.three.rfull .dom-l,.three.rfull .dom-c,.three.rfull>.rz[data-rz="domLW"],
.three.rfull>.rz[data-rz="domRW"]{display:none}
.three.rfull .dom-r{flex:1 1 auto!important;width:auto!important}
.iconbtn.off{color:var(--icon-dis)}
.iconbtn.off:hover{color:var(--icon-1)}
.tabs{flex:0 0 auto;display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--border-subtle);align-items:center}
.tab{height:32px;padding:0 10px;border-radius:var(--r-sm) var(--r-sm) 0 0;font-size:13px;color:var(--text-2);
  display:inline-flex;align-items:center;gap:6px;position:relative;transition:color var(--mo-state) var(--ease)}
.tab:hover{color:var(--text-1)}
.tab.on{color:var(--text-1);font-weight:500}
.tab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--text-1);border-radius:2px 2px 0 0}
.tab .n{font-size:11px;font-family:var(--mono);color:var(--text-3)}
.rpane{flex:1;min-height:0;padding:14px}
/* 产物卡 */
.art{padding:12px;border:1px solid var(--border-subtle);border-radius:var(--r-lg);margin-bottom:10px;
  transition:border-color var(--mo-state) var(--ease);cursor:pointer}
.art:hover{border-color:var(--border-strong)}
.art-h{display:flex;gap:10px;align-items:flex-start}
.art-ico{width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 32px;background:var(--surface-2)}
.art-n{font-size:13px;line-height:18px;font-weight:600}
.art-m{font-size:11px;line-height:16px;color:var(--text-3);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.art-prev{margin-top:10px;border-radius:var(--r-md);border:1px solid var(--border-subtle);background:var(--surface-2);
  padding:10px 12px;font-size:12px;line-height:19px;color:var(--text-3);max-height:96px;overflow:hidden;position:relative}
/* 验收条 */
.accept{flex:0 0 auto;padding:12px 14px;border-top:1px solid var(--border-subtle);
  background:var(--surface-glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--a-200);display:flex;flex-direction:column;gap:10px}
.accept-hint{font-size:12px;line-height:18px;color:var(--text-3);display:flex;gap:6px;align-items:flex-start}
/* 证据 */
.ev{display:flex;gap:10px;padding:10px;border:1px solid var(--border-subtle);border-radius:var(--r-md);margin-bottom:8px;
  align-items:flex-start}
.ev-ico{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 28px}
.ev-ico.pass{background:var(--done-bg);color:var(--done-tx)}
.ev-ico.pend{background:var(--wait-bg);color:var(--wait-tx)}
.ev-ico.fail{background:var(--fail-bg);color:var(--fail-tx)}
.ev-n{font-size:13px;line-height:18px;font-weight:500}
.ev-d{font-size:12px;line-height:17px;color:var(--text-3);margin-top:2px}
.ev-cmd{font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--surface-2);padding:4px 7px;
  border-radius:4px;margin-top:6px;display:inline-block;border:1px solid var(--border-subtle)}
.shot{margin-top:8px;border-radius:var(--r-md);border:1px solid var(--border-subtle);overflow:hidden;background:var(--surface-2)}

/* ===== 单 Session 轨迹 ===== */
/* ── 轨迹：低噪密集表 ──────────────────────────────────────
   6 张指标卡压成一行摘要，步骤行去掉卡片与进度条，
   颜色只留在角色标签的文字上；选中行靠左侧细条表达。 */
.tr-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tr-f{display:flex;gap:2px;flex:1;min-width:0;flex-wrap:wrap}
.tr-f button{height:24px;padding:0 9px;border-radius:var(--r-sm);font-size:12px;color:var(--text-3);
  display:inline-flex;align-items:center;gap:5px;transition:color var(--mo-state) var(--ease),background var(--mo-state) var(--ease)}
.tr-f button:hover{color:var(--text-1);background:var(--int-subtle)}
.tr-f button.on{color:var(--text-1);background:var(--a-200)}
.tr-f button i{font-family:var(--mono);font-size:10px;font-style:normal;opacity:.6}
.tr-srch{flex:0 0 132px;height:24px;padding:0 8px;border-radius:var(--r-sm);display:flex;align-items:center;gap:6px;
  background:var(--a-100);border:1px solid var(--border-subtle);font-size:12px;color:var(--text-3)}

.tr-strip{padding:2px 0 0;margin-bottom:10px}
.tr-srow{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.tr-sl{width:30px;flex:0 0 30px;font-size:10px;line-height:14px;color:var(--text-3);text-align:right;
  font-family:var(--mono)}
.tr-sc{flex:1;display:flex;gap:3px;min-width:0;height:9px;justify-content:space-between}
.tr-b{flex:1 1 0;min-width:3px;max-width:16px;border-radius:2px;background:var(--a-200);cursor:pointer;
  transition:transform var(--mo-state) var(--ease),outline-color var(--mo-state) var(--ease);
  outline:1.5px solid transparent;outline-offset:1.5px}
.tr-b.hit.k-assistant{background:var(--p-600)}
.tr-b.hit.k-sub{background:var(--gr-700)}
.tr-b.hit.k-tool{background:var(--am-700)}
.tr-b.hit.k-error{background:var(--rd-700)}
.tr-b:hover{transform:scaleY(1.45)}
.tr-b.on{outline-color:var(--focus)}
.tr-axis{display:flex;margin-left:39px;padding-top:5px;font-family:var(--mono);font-size:10px;color:var(--text-3)}
.tr-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 10px;
  border-top:1px solid var(--border-subtle);font-size:11px;line-height:16px;color:var(--text-3);font-family:var(--mono)}
.tr-sum b{color:var(--text-1);font-weight:600}
.tr-sum .sepdot{opacity:.45}
.tr-sum .bad b{color:var(--fail-tx)}

/* 主从分屏：只在产物面板放大后才铺开，640px 宽度下改为行内展开 */
.tr-wrap{display:flex;gap:12px;align-items:flex-start;min-height:0}
.tr-list{flex:1;min-width:0}
.tr-item{border-bottom:1px solid var(--border-subtle)}
.tr-item:first-child{border-top:1px solid var(--border-subtle)}
.tr-row{width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px 7px 8px;text-align:left;
  position:relative;transition:background var(--mo-state) var(--ease)}
.tr-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;
  transition:background var(--mo-state) var(--ease)}
.tr-row:hover{background:var(--int-subtle)}
.tr-item.on .tr-row{background:var(--a-100)}
.tr-item.on .tr-row::before{background:var(--focus)}
.tr-dot{flex:0 0 5px;width:5px;height:5px;border-radius:50%;background:var(--text-dis)}
.tr-item.k-assistant .tr-dot{background:var(--p-600)}
.tr-item.k-tool .tr-dot{background:var(--am-700)}
.tr-item.k-sub .tr-dot{background:var(--gr-700)}
.tr-item.k-error .tr-dot{background:var(--rd-700)}
.tr-k{flex:0 0 auto;font-size:10px;line-height:16px;font-weight:500;letter-spacing:.06em;
  font-family:var(--mono);color:var(--text-3);width:54px;white-space:nowrap;flex:0 0 54px}
.tr-item.k-assistant .tr-k{color:var(--cat2-fg)}
.tr-item.k-tool .tr-k{color:var(--cat4-fg)}
.tr-item.k-sub .tr-k{color:var(--cat3-fg)}
.tr-item.k-error .tr-k{color:var(--fail-tx)}
.tr-t{flex:1;min-width:0;font-size:12px;line-height:18px;color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-d{flex:0 0 42px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--text-3);
  font-variant-numeric:tabular-nums}

/* 详情：行内展开（窄）/ 右侧定栏（放大后） */
.tr-detail{padding:10px 10px 12px 20px;background:var(--surface-2);border-bottom:1px solid var(--border-subtle)}
.tr-pane{flex:0 0 288px;position:sticky;top:0;padding:12px;border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);background:var(--surface-2)}
.tr-pane-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tr-pane-h .tr-k{width:auto}
.tr-sec{font-size:10px;letter-spacing:.06em;color:var(--text-3);font-family:var(--mono);
  margin:12px 0 4px;padding-top:9px;border-top:1px solid var(--border-subtle)}
.tr-detail .kv,.tr-pane .kv{line-height:21px;font-size:12px}
.tr-note{display:flex;align-items:flex-start;gap:6px;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--border-subtle);font-size:11px;line-height:16px;color:var(--text-3)}
.tr-note svg{flex:0 0 12px;margin-top:2px}
.tr-empty{padding:28px 12px;text-align:center;font-size:12px;color:var(--text-3)}

/* ===================== Diff / 代码 ===================== */
.filerow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);font-size:13px;
  transition:background var(--mo-state) var(--ease);cursor:pointer}
.filerow:hover{background:var(--int-subtle)}
.filerow.on{background:var(--a-200)}
.filerow .fn{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.filerow .gs{font-family:var(--mono);font-size:11px;font-weight:500;width:14px;text-align:center}
.gs.A{color:var(--git-add)} .gs.M{color:var(--git-mod)} .gs.D{color:var(--git-del)} .gs.U{color:var(--git-un)}
.stat{font-family:var(--mono);font-size:11px;display:flex;gap:6px}
.stat .p{color:var(--git-add)} .stat .m{color:var(--git-del)}
.codebox{border:1px solid var(--border-subtle);border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.code-h{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-1);border-bottom:1px solid var(--border-subtle)}
.code-h .pth{flex:1;font-family:var(--mono);font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.dl{display:grid;grid-template-columns:44px 1fr;font-family:var(--mono);font-size:12px;line-height:20px}
.dl .ln{text-align:right;padding-right:10px;color:var(--text-3);user-select:none;border-right:1px solid var(--border-subtle)}
.dl .ct{padding-left:10px;white-space:pre-wrap;word-break:break-all;position:relative;cursor:text}
.dl.add{background:var(--diff-add)} .dl.add .ct{color:var(--git-add)}
.dl.del{background:var(--diff-del)} .dl.del .ct{color:var(--git-del)}
.dl.hunk{background:var(--info-bg)} .dl.hunk .ct{color:var(--info-tx)}
.dl:hover .cmt-add{opacity:1}
.cmt-add{position:absolute;left:-30px;top:1px;width:18px;height:18px;border-radius:4px;background:var(--g-1000);
  color:var(--bg-100);display:grid;place-items:center;font-size:13px;opacity:0;transition:opacity var(--mo-state) var(--ease)}
.k{color:var(--syn-kw)} .s{color:var(--syn-str)} .n{color:var(--syn-num)} .c{color:var(--syn-cm)}

/* 文档 diff */
.docdiff{font-size:13px;line-height:21px}
.docdiff .seg-add{background:var(--diff-add);color:var(--git-add);border-radius:3px;padding:1px 2px}
.docdiff .seg-del{background:var(--diff-del);color:var(--git-del);text-decoration:line-through;border-radius:3px;padding:1px 2px}
.docpara{padding:10px 12px;border-left:2px solid transparent;position:relative}
.docpara.changed{border-left-color:var(--wait-solid);background:var(--a-100)}
.docpara:hover .cmt-add{opacity:1;left:-26px;top:10px}
.cite{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--mono);color:var(--link);
  background:var(--info-bg);border:1px solid var(--info-bd);border-radius:var(--r-full);padding:0 6px;height:18px;
  vertical-align:middle;margin:0 2px;cursor:pointer}

/* 行内评论 */
.cmtbox{margin:6px 0 6px 44px;padding:10px;border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--a-100);display:flex;flex-direction:column;gap:8px;max-width:640px}
.cmtbox textarea{width:100%;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface-1);
  padding:7px 9px;font-size:13px;line-height:20px;resize:none;outline:0;min-height:56px;font-family:var(--sans)}
.cmtitem{margin:6px 0 6px 44px;padding:10px;border:1px solid var(--border-subtle);border-radius:var(--r-md);
  background:var(--surface-1);max-width:640px}

/* ===================== 通用列表页 ===================== */
.rows{border:1px solid var(--border-subtle);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-subtle);
  transition:background var(--mo-state) var(--ease);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--int-subtle)}
.row .main{flex:1;min-width:0}
.row .rt{font-size:14px;line-height:20px;font-weight:500;display:flex;align-items:center;gap:8px}
.row .rs{font-size:12px;line-height:17px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ecard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.ecard:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.ecard-h{display:flex;gap:10px;align-items:flex-start}
.ecard-ico{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;flex:0 0 36px}
.swrow{display:flex;align-items:center;gap:10px}
.sw{width:36px;height:20px;border-radius:var(--r-full);background:var(--g-400);position:relative;flex:0 0 36px;
  transition:background var(--mo-state) var(--ease)}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--r-full);background:#fff;
  transition:transform var(--mo-state) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--brand-solid)} .sw.on i{transform:translateX(16px)}
.banner{display:flex;gap:10px;padding:12px;border-radius:var(--r-md);border:1px solid;align-items:flex-start}
.banner.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.banner.wait{background:var(--wait-bg);border-color:var(--wait-bd);color:var(--wait-tx)}
.banner.done{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}

.entry-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.entry{padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.entry:hover{border-color:var(--border-strong);background:var(--a-100);transform:translateY(-1px)}
.ecard2.off{opacity:.55}
.conn-g{margin-bottom:26px}
.conn-gh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.conncard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.conncard:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.conncard.off{opacity:.68}
.conncard.off:hover{opacity:1}
.conn-ico{width:36px;height:36px;border-radius:var(--r-md);flex:0 0 36px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bg) 32%,transparent)}
.conn-ok{width:22px;height:22px;border-radius:var(--r-full);display:grid;place-items:center;flex:0 0 22px;
  background:var(--done-bg);color:var(--done-tx)}
.conncard .iconbtn{opacity:0;transition:opacity var(--mo-state) var(--ease)}
.conncard:hover .iconbtn{opacity:1}
/* 自动化卡片底部状态行：操作按钮 hover 才浮出，用卡片底色把右侧统计挡住 */
.auto-s{display:flex;align-items:center;gap:8px;position:relative;min-height:26px}
.auto-ops{position:absolute;right:-5px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:1px;
  padding-left:14px;background:var(--surface-1);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px);mask-image:linear-gradient(90deg,transparent 0,#000 14px);
  opacity:0;pointer-events:none;transition:opacity var(--mo-state) var(--ease)}
.ecard2:hover .auto-ops,.auto-ops:has(.menu){opacity:1;pointer-events:auto}

/* 执行记录时间轴（.rtl 前缀：.tl 已被对话流时间轴占用） */
.rtl{padding:2px 0 8px}
.rtl-i{position:relative;display:flex;gap:14px;cursor:pointer}
.rtl-i::before{content:'';position:absolute;left:4px;top:18px;bottom:-1px;width:2px;
  background:var(--border-subtle);border-radius:1px}
.rtl-i:last-child::before{display:none}
.rtl-rail{width:10px;flex:0 0 10px;display:flex;justify-content:center;padding-top:8px}
.rtl-node{width:10px;height:10px;border-radius:2px;flex:0 0 10px;background:var(--text-dis)}
.rtl-i.run .rtl-node{background:var(--run-solid);animation:breathe 1.6s var(--ease) infinite}
.rtl-i.wait .rtl-node{background:var(--wait-solid)}
.rtl-i.done .rtl-node{background:var(--done-solid)}
.rtl-i.fail .rtl-node{background:var(--fail-solid)}
.rtl-b{flex:1;min-width:0;margin-bottom:4px;padding:6px 12px 12px;border-radius:var(--r-lg);
  border:1px solid transparent;transition:background var(--mo-state) var(--ease),border-color var(--mo-state) var(--ease)}
.rtl-i:hover .rtl-b{background:var(--int-subtle);border-color:var(--border-subtle)}
.rtl-h{display:flex;align-items:center;gap:8px;min-width:0}
.rtl-t{font-size:14px;line-height:20px;font-weight:500;color:var(--text-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtl-when{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--text-3);font-family:var(--mono)}
.rtl-d{font-size:12px;line-height:18px;color:var(--text-3);margin-top:2px}
.rtl-m{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:150px;padding:5px;
  background:var(--surface-glass);backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:var(--r-md);
  box-shadow:var(--el-3),inset 0 1px 0 var(--a-300);animation:pop var(--mo-pop) var(--ease)}
.menu-i{width:100%;display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;
  border-radius:var(--r-sm);font-size:13px;color:var(--text-2);text-align:left;
  transition:background var(--mo-state) var(--ease)}
.menu-i:hover{background:var(--int-subtle);color:var(--text-1)}
.menu-i.del{color:var(--fail-tx)}
.menu-i.del:hover{background:var(--fail-bg)}
.entry.on{border-color:var(--border-strong);background:var(--a-100)}
.tplwrap{padding:16px;background:var(--a-100);border:1px solid var(--border-subtle);border-radius:var(--r-xl)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border-radius:var(--r-full);font-size:13px;color:var(--text-2);
  background:var(--a-100);display:inline-flex;align-items:center;gap:6px;transition:all var(--mo-state) var(--ease)}
.pill:hover{color:var(--text-1);background:var(--a-200)}
.pill.on{background:var(--a-300);color:var(--text-1);font-weight:500;box-shadow:inset 0 0 0 1px var(--border-strong)}
.pill .cn{font-family:var(--mono);font-size:11px;color:var(--p-900)}
.pill.on .cn{color:var(--p-900)}
/* ===== 专家卡：纸质简历 + 拍立得照片（尺寸/角度/阴影对齐现网实测） ===== */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:44px 16px;
  padding-top:44px;align-content:start}
.rwrap{position:relative;cursor:pointer}
.rcard{position:relative;background:var(--paper);border:1px solid var(--border-subtle);
  border-radius:24px;padding:60px 18px 18px;display:flex;flex-direction:column;
  transition:transform var(--mo-state) var(--ease),box-shadow var(--mo-state) var(--ease),
    border-color var(--mo-state) var(--ease)}
.rwrap:hover .rcard{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--el-2)}
/* 拍立得：白卡纸相框、下边框更宽、轻微倾斜、双层投影 */
.polaroid{position:absolute;top:-36px;right:16px;width:86px;height:109px;z-index:2;
  background:var(--polaroid-frame);border-radius:2px;padding:5px 5px 14px;
  box-shadow:var(--polaroid-shadow);
  transition:transform var(--mo-pop) var(--ease)}
.rwrap:hover .polaroid{transform:rotate(0deg) translateY(-2px) scale(1.03)!important}
.polaroid-in{display:block;width:76px;height:90px;border-radius:1px;overflow:hidden;background:var(--polaroid-inner)}
.polaroid-in img{width:100%;height:100%;object-fit:cover;display:block}
/* 手写签名：英文名作水印，压在右上留白处 */
.rsign{position:absolute;top:16px;left:18px;right:110px;
  font-family:"Bradley Hand","Snell Roundhand","Segoe Script","Comic Sans MS",cursive;
  font-size:24px;line-height:32px;font-weight:600;color:var(--a-400);
  transform:rotate(-2.5deg);transform-origin:left center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.rname{margin:0 0 8px;font-size:20px;line-height:28px;font-weight:700;color:var(--text-1);letter-spacing:-.3px}
.rtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.rtag{background:var(--a-100);color:var(--text-2);border-radius:4px;padding:2px 8px;font-size:12px;line-height:16px}
.rdiv{height:1px;background:var(--a-200);margin-bottom:16px}
.rdesc{margin:0;font-size:13px;line-height:21px;color:var(--text-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.rfoot{display:flex;align-items:center;gap:8px;margin-top:14px}
.rfoot .btn{opacity:0;transition:opacity var(--mo-state) var(--ease)}
.rwrap:hover .rfoot .btn{opacity:1}

.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-content:start}
.ecard2{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;
  transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.ecard2:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.ecard2-h{display:flex;gap:11px;align-items:flex-start}
.ex-av{width:42px;height:42px;border-radius:var(--r-full);flex:0 0 42px;object-fit:cover;background:var(--catn-bg)}
.sk-ico{width:34px;height:34px;border-radius:var(--r-md);flex:0 0 34px;display:grid;place-items:center}
.sk-ico.neutral{background:var(--a-100);color:var(--icon-1);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.ecard2 .btn.sm,.ecard2 .iconbtn{opacity:0;transition:opacity var(--mo-state) var(--ease)}
.ecard2:hover .btn.sm,.ecard2:hover .iconbtn{opacity:1}

/* ===== 沉浸式新建任务页 ===== */
.newpage{flex:1;min-height:0;padding:0 24px 48px}
.newinner{max-width:860px;margin:0 auto;padding-top:72px}
.newhero{text-align:center;margin-bottom:28px;position:relative}
.newtitle{margin:0;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.64px}
.newsub{margin:8px 0 0;font-size:14px;line-height:22px;color:var(--text-3)}
/* 新建页的输入卡与工作台同款，只是更高一点 */
.newbox textarea{min-height:104px}
.newsep{width:1px;height:18px;background:var(--border-subtle);margin:0 2px}
.newtpl{margin-top:40px}
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tplcard{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;
  border-radius:var(--r-lg);transition:border-color var(--mo-state) var(--ease),transform var(--mo-state) var(--ease)}
.tplcard:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.tplcard.on{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.tpl-shot{width:100%;height:auto;display:block;border-bottom:1px solid var(--border-subtle)}
.tplcard-b{padding:12px 14px 14px}
@media (max-width:900px){.tplgrid{grid-template-columns:1fr}}

/* ===================== Dialog ===================== */
.mask{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:24px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade var(--mo-ov) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:100%;max-width:680px;max-height:86vh;background:var(--surface-glass);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:var(--r-xl);
  box-shadow:var(--el-3),inset 0 1px 0 var(--a-300);display:flex;flex-direction:column;overflow:hidden;
  animation:pop var(--mo-ov) var(--ease)}
.dlg.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px}
.dlg-b{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:8px;background:var(--a-100)}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>label{font-size:13px;line-height:18px;font-weight:500}
.fld .hint{font-size:12px;line-height:17px;color:var(--text-3)}
.inp{min-height:36px;border-radius:var(--r-sm);background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--control-border);
  padding:8px 12px;font-size:14px;line-height:20px;outline:0;border:0;width:100%;font-family:var(--sans);resize:vertical}
.inp:focus{box-shadow:inset 0 0 0 1px var(--focus)}
.inp::placeholder{color:var(--text-dis)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{padding:12px;border-radius:var(--r-md);border:1px solid var(--border-strong);text-align:left;
  transition:all var(--mo-state) var(--ease);display:flex;gap:10px;align-items:flex-start}
.choice:hover{border-color:var(--border-strong);background:var(--a-100)}
.choice.on{border-color:var(--focus);background:var(--a-200)}
.choice .ct2{font-size:13px;line-height:18px;font-weight:600}
.choice .cd{font-size:12px;line-height:17px;color:var(--text-3);margin-top:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;background:var(--g-1000);
  color:var(--bg-100);padding:10px 16px;border-radius:var(--r-full);font-size:13px;
  box-shadow:var(--el-2),inset 0 1px 0 var(--a-300);
  display:flex;align-items:center;gap:8px;animation:pop var(--mo-pop) var(--ease)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:64px 24px;
  color:var(--text-3);text-align:center}
.divider{height:1px;background:var(--border-subtle);margin:4px 0}
.note{font-size:12px;line-height:18px;color:var(--text-3)}
</style>
</head>

// 活跃日历数据：固定种子生成，工作日高于周末，含两段连续高活跃
const HEAT = (() => {
  let seed = 20260915;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const days = [];
  const today = new Date(2026, 8, 15);
  const start = new Date(today); start.setDate(start.getDate() - 125);
  // 对齐到周一
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const dow = (d.getDay() + 6) % 7;
    const weekend = dow >= 5;
    const idx = Math.round((d - start) / 86400000);
    const burst = (idx > 42 && idx < 58) || (idx > 92 && idx < 106) ? 2 : 0;
    let n = weekend ? Math.floor(rnd() * 3.4) : 1 + Math.floor(rnd() * 5.6);
    n += burst;
    if (rnd() < (weekend ? 0.22 : 0.04)) n = 0;
    days.push({ d: new Date(d), n: Math.min(n, 9) });
  }
  return days;
})();

})();

// 迷你点阵：用于指标卡右上角，一列一天，点越高当天量越大
function spark(vals, tone) {
  const cols = vals.length, rows = 5, W = 76;
  const dx = W / cols, dy = 5.4, H = rows * dy;
  const r = Math.min(1.7, dx / 2 - 0.55);
  const max = Math.max(...vals, 1);
  let out = '';
  vals.forEach((v, i) => {
    const on = v ? Math.max(1, Math.round(v / max * rows)) : 0;
    for (let j = 0; j < rows; j++) {
      const lit = j < on, last = i === cols - 1;
      const sz = (lit ? r : r * 0.62) * 2;
      out += `<rect x="${(i * dx + dx / 2 - sz / 2).toFixed(2)}" y="${(H - j * dy - dy / 2 - sz / 2).toFixed(2)}"
        width="${sz.toFixed(2)}" height="${sz.toFixed(2)}" rx=".3" fill="var(--${tone}-solid)"
        opacity="${lit ? (last ? 1 : .6) : .16}"/>`;
    }
  });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${out}</svg>`;
}

// 双序列点阵折线：交付趋势。曲线本身是等距圆点，下方用点阵代替面积填充
function trend(days, a, b) {
  const w = 560, h = 150, pad = 22, base = h - 26, max = Math.max(...a, ...b, 1);
  const X = i => pad + i * ((w - pad * 2) / (days.length - 1));
  const Y = v => base - (v / max) * (h - 52);
  const path = vals => vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const ticks = [0, Math.ceil(max / 2), max];

  // 面积改为点阵场：每 12px 一列，从基线向上排到曲线高度
  const step = 12, dy = 10;
  let field = '';
  for (let x = pad; x <= w - pad; x += step) {
    const t = (x - pad) / ((w - pad * 2) / (days.length - 1));
    const i0 = Math.min(Math.floor(t), a.length - 2), f = t - i0;
    const yv = Y(a[i0] + (a[i0 + 1] - a[i0]) * f);
    for (let y = base - dy / 2; y > yv; y -= dy) {
      field += `<rect x="${x - 1.3}" y="${(y - 1.3).toFixed(1)}" width="2.6" height="2.6" fill="var(--done-solid)"
        opacity="${(0.1 + 0.2 * (1 - (base - y) / (base - yv + .001))).toFixed(2)}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="trend">
    ${ticks.map(t => `<g><line x1="${pad}" x2="${w - pad}" y1="${Y(t)}" y2="${Y(t)}"
      stroke="var(--border-subtle)" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="1.8 4.4"/>
      <text x="${pad - 6}" y="${Y(t) + 4}" text-anchor="end" class="ax">${t}</text></g>`).join('')}
    ${field}
    <path d="${path(b)}" fill="none" stroke="var(--wait-solid)" stroke-width="2"
      stroke-linecap="butt" stroke-dasharray="2 3.6" opacity=".7"/>
    <path d="${path(a)}" fill="none" stroke="var(--done-solid)" stroke-width="2.3"
      stroke-linecap="butt" stroke-dasharray="2.3 2.7"/>
    ${days.map((d, i) => i % 3 === 0
      ? `<text x="${X(i)}" y="${h - 8}" text-anchor="middle" class="ax">${d.getMonth() + 1}/${d.getDate()}</text>` : '').join('')}
    ${a.map((v, i) => `<rect x="${(X(i) - 2.5).toFixed(1)}" y="${(Y(v) - 2.5).toFixed(1)}" width="5" height="5" rx=".6" fill="var(--done-solid)"><title>${d2(days[i])} 已接受 ${v}</title></rect>`).join('')}
  </svg>`;
}

function buildTrace(tid) {
  const f = FLOW[tid]; if (!f) return null;
  let sd = tid.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7) & 0x7fffffff;
  const r = () => (sd = (sd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const steps = []; let t0 = 0, llm = 0, tool = 0, tok = 0, err = 0;
  const push = (kind, label, extra) => {
    const dur = extra.dur != null ? extra.dur : +(0.6 + r() * 4.2).toFixed(2);
    const st = t0; t0 += dur;
    steps.push(Object.assign({ kind, label, start: +st.toFixed(2), dur }, extra));
  };
  [['pre', f.pre], ['post', f.post || []]].forEach(([seg, list]) => {
    list.forEach((x, i) => {
      if (x[0] === 'say' || x[0] === 'think') {
        const inTok = 900 + Math.floor(r() * 2600), outTok = 60 + Math.floor(r() * 420);
        llm++; tok += inTok + outTok;
        push('assistant', x[1], { model: MODELS[llm % MODELS.length], inTok, outTok,
          ttft: +(0.4 + r() * 1.6).toFixed(2), think: x[0] === 'think' });
      } else if (x[0] === 'tools') {
        x[2].forEach(([n, v]) => {
          if (n === '已思考') {
            const inTok = 700 + Math.floor(r() * 1800), outTok = 40 + Math.floor(r() * 260);
            llm++; tok += inTok + outTok;
            push('assistant', v, { model: MODELS[llm % MODELS.length], inTok, outTok,
              ttft: +(0.3 + r() * 1.1).toFixed(2), think: true });
          } else { tool++; push('tool', n, { arg: v, ok: true }); }
        });
      } else if (x[0] === 'sub') {
        const running = x[3] === 'run';
        if (!running) llm += 3; tool += 2;
        const inTok = 4200 + Math.floor(r() * 5200), outTok = 300 + Math.floor(r() * 900);
        tok += inTok + outTok;
        push('sub', x[1] + ' · ' + x[2], { agent: x[1], work: x[2], running,
          inTok, outTok, dur: running ? 0 : parseFloat(x[4]) || 60 });
      }
    });
  });

  if (t && t.st === 'fail') { err = 1; push('error', '连接器鉴权过期，拉取构建记录失败', { dur: 0.4 }); }
  return { steps, llm, tool, err, tok, dur: t0,
    cost: +(tok / 1000 * 0.012).toFixed(4) };
}

const MON = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function heatmap() {
  // 按周切列
  const weeks = [];
  for (let i = 0; i < HEAT.length; i += 7) weeks.push(HEAT.slice(i, i + 7));
  // 月份标签：某周的周一进入新月份时打标
  let lastM = -1;
  const labels = weeks.map(w => {
    const m = w[0].d.getMonth();
    if (m !== lastM) { lastM = m; return MON[m]; }
    return '';
  });
  const total = HEAT.reduce((a, x) => a + x.n, 0);
  const active = HEAT.filter(x => x.n > 0).length;
  // 最长连续活跃
  let best = 0, cur = 0;
  HEAT.forEach(x => { cur = x.n > 0 ? cur + 1 : 0; if (cur > best) best = cur; });

  return `<div class="card heat-wrap">
    <div class="heat-scroll scroll">
      <div class="heat-grid">
        <div class="heat-months">${labels.map(l => `<span>${l}</span>`).join('')}</div>
        <div class="heat-dows">${['一', '', '三', '', '五', '', '日'].map(d => `<span>${d}</span>`).join('')}</div>
        <div class="heat-cols">
          ${weeks.map(w => `<div class="heat-col">${w.map(x => {
            const ds = `${x.d.getMonth() + 1}月${x.d.getDate()}日`;
            return `<i class="heat-cell" style="background:var(--heat-${heatLv(x.n)})" title="${ds} · ${x.n ? x.n + ' 个任务完成' : '无活动'}"></i>`;
          }).join('')}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="heat-foot">
      <span>近 18 周共完成 <b>${total}</b> 个任务</span>
      <span class="sepdot">·</span>
      <span><b>${active}</b> 天有产出</span>
      <span class="sepdot">·</span>
      <span>最长连续 <b>${best}</b> 天</span>
    </div>
  </div>`;
}
