/*
 * DevUI 多主题 · 组件覆盖层（手写，非生成）
 *
 * 只做"变量换值做不到"的事：玻璃滤镜、raise 主按钮材质、像素硬边与焦点、极光外框、按压反馈、字体族。
 * 规则：
 *   1. 一律通过 var(--devui-*) / var(--devui-ext-*) / var(--devui-ai-*) 取值，不写死色值；
 *   2. 官方三主题（新无限 / 无限 / 追光）下除第 1 节外所有规则都不生效（选择器只命中 [data-theme^="as"]）；
 *   3. 组件类名已按 ng-devui 开源版源码（DevCloudFE/ng-devui@ef76c44, 2025-04）核对过；
 *      现网组件库若有差异，按 DESIGN.md §12 的类名对照表核对实际 DOM。
 */

/* ───────────── 0. 页面底图 / 字体 ─────────────
 * 现网墨与 AS2 的 body 由扩展层接管：底图（纯色 / 玻璃光晕 / 网格 / 点阵 / 极光）与字体族都来自变量 */
html[data-theme^="as"] body {
  background: var(--devui-ext-backdrop);
  background-attachment: fixed;
  color: var(--devui-text);
}
html[data-theme^="as2"] body { font-family: var(--devui-ext-font-family); }
[data-theme^="as2"] :is(h1, h2, h3, h4, .devui-card-title, d-modal-header, .as-display) {
  font-family: var(--devui-ext-font-family-display);
  font-weight: var(--devui-font-title-weight);
}
[data-theme^="as2"] :is(code, pre, kbd, samp) { font-family: var(--devui-ext-font-family-mono); }

/* ───────────── 1. 主按钮文字（深色主题主色为浅底，官方 primary / stress 文字是固定白） ───────────── */
:root :is(.devui-btn-primary, .devui-btn-stress):not(:disabled),
:root :is(.devui-btn-primary, .devui-btn-stress):not(:disabled) .icon,
[data-theme^="as"] .as-btn-primary {
  color: var(--devui-ext-on-primary);
  fill: var(--devui-ext-on-primary);
}

/* ───────────── 2. AS2 主按钮：墨色 raise 胶囊 ─────────────
 * 上下两段渐变 + 外环 + 短投影（--devui-ext-btn-raise-*）。同一条规则覆盖所有风格：
 *   极简      上下段不同 + 外环 + 投影            → 立体墨色胶囊
 *   像素      上下段相同（强调色）、投影无（浅）/ 硬投影（深）→ 平涂块（圆角变量为 0）
 *   极光 / Bento 深色上下段 + 轻投影（Bento 无投影）       */
[data-theme^="as2"] :is(.devui-btn-primary, .devui-btn-stress):not(:disabled),
[data-theme^="as2"] .as-btn-primary {
  background: linear-gradient(180deg, var(--devui-ext-btn-raise-top), var(--devui-ext-btn-raise-bottom));
  border-color: var(--devui-ext-btn-raise-bottom);
  border-radius: var(--devui-ai-radius-pill);
  box-shadow: var(--devui-ext-btn-raise-shadow);
  transition: transform var(--devui-animation-duration-fast) var(--devui-ai-ease-press),
              background var(--devui-animation-duration-fast) var(--devui-ai-ease),
              box-shadow var(--devui-animation-duration-fast) var(--devui-ai-ease);
}
[data-theme^="as2"] :is(.devui-btn-primary, .devui-btn-stress):not(:disabled):hover,
[data-theme^="as2"] .as-btn-primary:hover {
  background: linear-gradient(180deg, var(--devui-ext-btn-raise-top-hover), var(--devui-ext-btn-raise-bottom-hover));
}
[data-theme^="as2"] :is(.devui-btn-primary, .devui-btn-stress, .as-btn-primary):not(:disabled):active { transform: scale(0.985); }
[data-theme^="as2"] .devui-btn { border-radius: var(--devui-ai-radius-pill); }

/* ───────────── 3. 液态玻璃 ─────────────
 * 区块变量（base-bg 等）是半透明色，必须配合 backdrop-filter 才成立。 */
[data-theme="as2-liquid"] :is(
  .devui-card, d-modal .modal-content, d-drawer .drawer-content,
  .devui-dropdown-menu, .devui-popover, .devui-tooltip, .devui-toast-item,
  d-header, d-aside
), .as-glass {
  -webkit-backdrop-filter: var(--devui-ai-glass);
  backdrop-filter: var(--devui-ai-glass);
  border: 1px solid var(--devui-ext-material-edge);
  box-shadow: var(--devui-ext-material-highlight), var(--devui-shadow-length-base) var(--devui-light-shadow);
}
.as-glass { background: var(--devui-base-bg); border-radius: var(--devui-border-radius-card); }
/* 遮罩层轻度模糊，让弹窗后的内容"退到玻璃后面" */
[data-theme="as2-liquid"] :is(d-modal .modal-backdrop, d-drawer .overlay-backdrop) {
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
/* 不支持 backdrop-filter 或用户要求降低透明度 → 退化为不透明面，保证可读 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  [data-theme="as2-liquid"] { --devui-base-bg: #f7f9fd; --devui-connected-overlay-bg: #ffffff; --devui-fullscreen-overlay-bg: #ffffff; --devui-ai-card: #f7f9fd; }
}
@media (prefers-reduced-transparency: reduce) {
  [data-theme="as2-liquid"] { --devui-base-bg: #f7f9fd; --devui-connected-overlay-bg: #ffffff; --devui-fullscreen-overlay-bg: #ffffff; --devui-ai-card: #f7f9fd; --devui-ai-glass: none; }
}

/* 流光：运行态 / Agent 思考中。仅液态玻璃有渐变（--devui-ext-accent-glow）；其他主题退化为纯色描边 */
.as-glow-border { position: relative; border: 1px solid var(--devui-ext-accent); }
[data-theme="as2-liquid"] .as-glow-border { border-color: transparent; }
[data-theme="as2-liquid"] .as-glow-border::before {
  content: "";
  position: absolute;
  inset: calc(-1 * var(--devui-ext-border-width));
  padding: var(--devui-ext-border-width);
  border-radius: inherit;
  background: var(--devui-ext-accent-glow);
  background-size: 200% 100%;
  /* 用遮罩只露出描边环，面本身保持半透明玻璃 */
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: as-glow-flow var(--devui-ai-shimmer-dur) linear infinite;
}
@keyframes as-glow-flow { to { background-position: -200% 0; } }

/* ───────────── 4. 像素 ─────────────
 * 对应 demo 的「开发者皮肤」：结构靠 1px 线与对齐，不靠投影；卡片悬停 = 强调色边 + 硬投影 + 左上位移 1px；
 * 焦点 = 1px 虚线；按下 = 位移 2px、投影收回；选中 = 反白块。圆角 / 字体 / 配色 / 硬投影几何都来自变量。 */
[data-theme="as2-pixel"] { -webkit-font-smoothing: auto; }
[data-theme="as2-pixel"] ::selection { background: var(--devui-brand); color: var(--devui-light-text); }
[data-theme="as2-pixel"] :is(
  .devui-card, d-modal .modal-content, .devui-dropdown-menu, .devui-popover, .devui-toast-item,
  .devui-form-control, .devui-input, .devui-form-controls textarea, .devui-tag-item
) {
  border: var(--devui-ext-border-width) solid var(--devui-line);
  box-shadow: none;
}
[data-theme="as2-pixel"] :is(.devui-dropdown-menu, .devui-popover, d-modal .modal-content) { box-shadow: var(--devui-ai-shadow-pop); }
[data-theme="as2-pixel"] .devui-card:hover {
  border-color: var(--devui-brand);
  box-shadow: var(--devui-ai-shadow-pop);
  transform: translate(-1px, -1px);
}
[data-theme="as2-pixel"] :focus-visible { outline: 1px dashed var(--devui-ai-focus-ring); outline-offset: 3px; }
[data-theme="as2-pixel"] :is(.devui-btn-primary, .devui-btn-stress, .as-btn-primary):not(:disabled):active {
  transform: translate(var(--devui-ext-press-offset), var(--devui-ext-press-offset));
  box-shadow: 1px 1px 0 0 #000;
}
[data-theme="as2-pixel"] .devui-btn-text { text-decoration: underline; text-underline-offset: 3px; }

/* ───────────── 5. 极光 ─────────────
 * 半包围结构的外框：深色网格渐变从侧栏起，包住内容面板的左 / 上 / 下。完整结构需要布局层配合（DESIGN.md §10.3），
 * 这里只给出侧栏本身的深色外框。 */
[data-theme="as2-aurora"] d-aside {
  background: var(--devui-ext-frame);
  color: #ffffff;
  border-radius: var(--devui-ai-radius-panel);
}

/* ───────────── 6. Bento ─────────────
 * 侧栏与每个内容区都是独立的大圆角卡片，靠画布（--devui-global-bg）上的留白分块。 */
[data-theme="as2-bento"] :is(d-aside, d-content, .devui-card) { border-radius: var(--devui-ai-radius-panel); }

/* ───────────── 7. 动效偏好 ───────────── */
@media (prefers-reduced-motion: reduce) {
  .as-glow-border, .as-glow-border::before { animation: none !important; }
  :root, [data-theme] {
    --devui-ai-dur-stream: 0ms; --devui-ai-dur-expand: 0ms; --devui-ai-dur-enter: 0ms;
    --devui-ai-pulse: 0s; --devui-ai-shimmer-dur: 0s;
  }
}

/* ======================================================================
   新建任务首页
   结构参照 CodeAgent Desktop 参考稿：问候 + 能力卡组 + 输入区 + 专家 + 灵感。
   取色与圆角沿用 DESIGN.md AS2 Token；在此之上叠一层克制的开发者视觉：
   等宽元信息、点阵纹理、终端式槽位编号。
   ====================================================================== */

.task-launch-page{
 height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;
 --lmono:var(--devui-ext-font-family-mono);
 --lmax:940px;
 --tuck:52px; --dyk:.92; --vcut:12px;
 --card-amber:#e2913b;  --card-amber-ink:#2d1a04;
 --card-blue:#2f6ae8;   --card-blue-ink:#ffffff;
 --card-lime:#b7d84e;   --card-lime-ink:#1f2a09;
 --card-sky:#8ecbe8;    --card-sky-ink:#0c2733;
 --card-violet:#9a7cf2; --card-violet-ink:#ffffff;
 --card-slate:#dbdbe1;  --card-slate-ink:#2b2b32;
}
[data-theme="as2"][data-mode="dark"] .task-launch-page{
 --card-amber:#c97e2c;  --card-amber-ink:#1d1204;
 --card-blue:#3067d6;   --card-blue-ink:#f3f6ff;
 --card-lime:#9ec03f;   --card-lime-ink:#17200a;
 --card-sky:#6fb3d4;    --card-sky-ink:#07202b;
 --card-violet:#8569e0; --card-violet-ink:#f6f3ff;
 --card-slate:#3d3d46;  --card-slate-ink:#d6d6de;
}

.task-launch-scroll{min-height:0;flex:1;overscroll-behavior:contain}
.task-launch-inner{width:100%;max-width:var(--lmax);margin:0 auto;padding:40px 48px 44px;container-type:inline-size;container-name:launch}

/* ------------------------------------------------------------- 问候语 */
.launch-hero{position:relative;text-align:center;padding:16px 0 4px}
/* 点阵底纹：开发者感，但只在问候区且几乎不可察 */
.launch-hero::before{
 content:"";position:absolute;inset:-18px -40px -8px;pointer-events:none;
 background-image:radial-gradient(var(--devui-ai-border-strong) 1px,transparent 1px);
 background-size:14px 14px;opacity:.5;
 -webkit-mask-image:radial-gradient(ellipse 70% 100% at 50% 45%,#000 0%,transparent 72%);
 mask-image:radial-gradient(ellipse 70% 100% at 50% 45%,#000 0%,transparent 72%);
}
.launch-ask{
 position:relative;margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;
 font-family:var(--devui-ext-font-family-display);
 font-size:clamp(22px,2.3vw,29px);font-weight:400;line-height:1.5;letter-spacing:-.4px;color:var(--devui-text);
}
.launch-project{position:relative;display:inline-flex}
.launch-project-btn{
 display:inline-flex;align-items:center;gap:8px;max-width:min(520px,46vw);
 padding:4px 10px 4px 11px;margin:0 -2px;border-radius:12px;
 font:inherit;color:var(--devui-text-weak);
 border:1px solid transparent;transition:background 150ms var(--devui-ai-ease),border-color 150ms var(--devui-ai-ease),color 150ms var(--devui-ai-ease);
}
.launch-project-btn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.launch-project-btn>svg:first-child{flex:0 0 auto;color:var(--devui-brand)}
.launch-project-btn>svg:last-child{flex:0 0 auto;opacity:.55}
.launch-project-btn:hover,.launch-project-btn[aria-expanded="true"]{
 background:var(--devui-ai-card);border-color:var(--devui-ai-border-soft);color:var(--devui-text);
}
.launch-project-menu{
 position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:40;
 min-width:300px;max-width:min(380px,80vw);padding:6px;text-align:left;
 background:var(--devui-ai-card);border:1px solid var(--devui-ai-border-soft);
 border-radius:var(--devui-ai-radius-card);box-shadow:var(--devui-ai-shadow-pop);
}
.launch-project-menu button{
 display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--devui-ai-radius-row);
 color:var(--devui-text);text-align:left;
}
.launch-project-menu button:hover,.launch-project-menu button:focus-visible{background:var(--devui-ai-hover)}
.launch-project-menu button>svg:first-child{flex:0 0 auto;color:var(--devui-aide-text)}
.launch-project-menu button>span{flex:1;min-width:0;display:block}
.launch-project-menu b{display:block;font-size:var(--devui-ai-fs-ui);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.launch-project-menu em{
 display:block;font-style:normal;font-family:var(--lmono);font-size:11px;line-height:16px;
 color:var(--devui-aide-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.launch-project-sep{height:1px;margin:5px 8px;background:var(--devui-ai-border-soft)}

/* ---------------------------------------------------------- 能力卡组 */
.launch-stack{position:relative;margin-top:26px}
/* 卡组几何：
   --dy  下沉量（无单位，px）    --vis 露在输入框上方的可见高度（无单位，px）
   --tuck 输入框压住卡片的深度    --dyk/--vcut 由断点统一缩放
   高度 = vis + dy + tuck，下内边距 = dy + tuck + 14，
   于是每张卡的插画底边都停在输入框上沿之上（倾斜后仍留有余量）。 */
.launch-deck{
 position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;
 padding:0 10px;margin-bottom:calc(var(--tuck) * -1);
}
.launch-card{
 --dyp:calc(var(--dy) * var(--dyk) * 1px);
 position:relative;flex:0 0 auto;width:120px;margin:0 -16px;
 height:calc(var(--vis) * 1px - var(--vcut) + var(--dyp) + var(--tuck));
 display:flex;flex-direction:column;align-items:flex-start;gap:2px;
 padding:11px 12px calc(var(--dyp) + var(--tuck) + 14px);
 border-radius:14px;overflow:hidden;text-align:left;
 transform-origin:50% 100%;
 transform:translateY(var(--dyp)) rotate(var(--rot));
 background:var(--tone);color:var(--tone-ink);
 box-shadow:0 10px 22px -14px rgba(16,12,36,.55),0 2px 6px -3px rgba(16,12,36,.3);
 transition:transform 260ms var(--devui-ai-ease),box-shadow 260ms var(--devui-ai-ease),filter 260ms var(--devui-ai-ease);
}
.launch-card::after{ /* 点阵角标 */
 content:"";position:absolute;right:-6px;top:-6px;width:62px;height:62px;pointer-events:none;
 background-image:radial-gradient(currentColor 1.1px,transparent 1.1px);
 background-size:6px 6px;opacity:.22;
 -webkit-mask-image:linear-gradient(225deg,#000 10%,transparent 62%);
 mask-image:linear-gradient(225deg,#000 10%,transparent 62%);
}
.launch-card.tone-amber {--tone:var(--card-amber); --tone-ink:var(--card-amber-ink)}
.launch-card.tone-blue  {--tone:var(--card-blue);  --tone-ink:var(--card-blue-ink)}
.launch-card.tone-lime  {--tone:var(--card-lime);  --tone-ink:var(--card-lime-ink)}
.launch-card.tone-sky   {--tone:var(--card-sky);   --tone-ink:var(--card-sky-ink)}
.launch-card.tone-violet{--tone:var(--card-violet);--tone-ink:var(--card-violet-ink)}
.launch-card.tone-slate {--tone:var(--card-slate); --tone-ink:var(--card-slate-ink)}
/* 中间这张是主入口 */
.launch-card.tone-blue{width:134px;z-index:3}
.launch-card.tone-amber,.launch-card.tone-lime{z-index:2}
.launch-card-code{font-family:var(--lmono);font-size:9.5px;letter-spacing:.1em;opacity:.72}
.launch-card-name{font-size:13px;font-weight:600;line-height:18px;letter-spacing:.2px;white-space:nowrap}
.launch-card.tone-blue .launch-card-name{font-size:13.5px}
.launch-card-art{width:36px;height:38px;margin-top:auto;opacity:.95}
.launch-card:hover,.launch-card:focus-visible{
 z-index:6;transform:translateY(calc(var(--dyp) - 16px)) rotate(calc(var(--rot) * .3));
 box-shadow:0 20px 34px -16px rgba(16,12,36,.6),0 4px 10px -4px rgba(16,12,36,.32);
}
/* 选中一张：它抬起并摆正，其余整体下沉、让输入框压住，视觉焦点只剩一张 */
.launch-deck.has-on .launch-card:not(.on){
 transform:translateY(calc(var(--dyp) + 26px)) rotate(var(--rot));
 filter:brightness(.88) saturate(.72);
}
.launch-deck.has-on .launch-card:not(.on):hover,
.launch-deck.has-on .launch-card:not(.on):focus-visible{
 z-index:6;transform:translateY(calc(var(--dyp) + 4px)) rotate(calc(var(--rot) * .6));filter:none;
}
.launch-card.on{
 z-index:7;transform:translateY(calc(var(--dyp) - 22px)) rotate(0deg);
 box-shadow:0 26px 40px -16px rgba(16,12,36,.62),0 0 0 2px var(--devui-ai-card),0 0 0 4px var(--devui-brand);
}

/* ------------------------------------------------------------ 输入区 */
.launch-composer-slot{position:relative;z-index:4}
/* 外层卡片：把输入框和状态条一起框起来 */
.launch-composer{
 display:block;padding:4px 4px 0;

 border-radius:22px;box-shadow:0 18px 36px -26px rgba(16,12,36,.6);
 transition:border-color 150ms var(--devui-ai-ease),box-shadow 150ms var(--devui-ai-ease);
}
.launch-composer:focus-within{border-color:var(--devui-ai-border-strong);box-shadow:0 20px 40px -24px rgba(16,12,36,.68)}
.lc-paper{
 position:relative;padding:13px 13px 9px;
 background:var(--devui-ai-card);border:1px solid var(--devui-ai-border-soft);
 border-radius:18px;
 transition:border-color 150ms var(--devui-ai-ease);
}
.lc-paper:focus-within{border-color:var(--devui-ai-border-strong)}
.lc-files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lc-files>span{
 display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 5px 0 8px;border-radius:7px;
 font-size:var(--devui-ai-fs-micro);color:var(--devui-text-weak);background:var(--devui-ai-sunken);
}
.lc-files button{display:grid;place-items:center;width:16px;height:16px;border-radius:5px;color:var(--devui-aide-text)}
.lc-files button:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-paper textarea{
 display:block;width:100%;height:76px;min-height:76px;max-height:240px;resize:none;border:0;outline:none;padding:2px 2px 0;
 background:transparent;color:var(--devui-text);
 font-family:inherit;font-size:var(--devui-ai-fs-reading);line-height:24px;
}
.lc-paper textarea::placeholder{color:var(--devui-placeholder)}

.lc-bar{display:flex;align-items:center;gap:4px;margin-top:6px}
.lc-spacer{flex:1}
.lc-icon{
 display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
 color:var(--devui-aide-text);transition:background 140ms var(--devui-ai-ease),color 140ms var(--devui-ai-ease);
}
.lc-icon:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-icon.on{background:var(--devui-ai-selected);color:var(--devui-ai-selected-ink)}
/* Agent / Workflow：两段共用一个胶囊容器 */
.lc-switch{
 display:inline-flex;align-items:center;gap:2px;padding:2px;margin-left:2px;
 border-radius:var(--devui-ai-radius-pill);background:var(--devui-ai-sunken);
}
.lc-tab{
 display:inline-flex;align-items:center;justify-content:center;gap:7px;height:28px;padding:0 11px;
 border-radius:var(--devui-ai-radius-pill);font-size:var(--devui-ai-fs-ui);color:var(--devui-aide-text);
 border:1px solid transparent;
 transition:background 140ms var(--devui-ai-ease),color 140ms var(--devui-ai-ease);
}
.lc-tab:not(.on){width:28px;padding:0}
.lc-tab:not(.on):hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-tab.on{
 background:var(--devui-ai-card);color:var(--devui-text);
 border-color:var(--devui-ai-border-soft);box-shadow:var(--devui-ai-shadow-tile);
}
/* 已选专家气泡：跟在切换后面，带头像 */
.lc-expert{
 display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 6px;margin-left:6px;
 border-radius:var(--devui-ai-radius-pill);background:var(--devui-ai-card);
 border:1px solid var(--devui-ai-border-soft);
 font-size:var(--devui-ai-fs-ui);color:var(--devui-text);white-space:nowrap;min-width:0;
}
.lc-expert>span{overflow:hidden;text-overflow:ellipsis;max-width:180px}
.lc-expert>button{flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--devui-aide-text)}
.lc-expert>button:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-model{
 display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px 0 10px;border-radius:9px;
 font-family:var(--lmono);font-size:12px;letter-spacing:.01em;color:var(--devui-text-weak);
}
.lc-model:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-send{
 display:grid;place-items:center;width:32px;height:32px;margin-left:4px;border-radius:50%;
 background:var(--devui-brand);color:var(--devui-ext-on-primary,#fff);
 transition:background 140ms var(--devui-ai-ease),opacity 140ms var(--devui-ai-ease);
}
.lc-send:hover:not(:disabled){background:var(--devui-link-active)}
.lc-send:disabled{background:var(--devui-ai-sunken);color:var(--devui-placeholder);cursor:default}

.lc-control{position:relative;display:inline-flex}
.lc-menu{
 position:absolute;bottom:calc(100% + 8px);left:0;z-index:30;min-width:220px;padding:5px;
 background:var(--devui-ai-card);border:1px solid var(--devui-ai-border-soft);
 border-radius:var(--devui-ai-radius-card);box-shadow:var(--devui-ai-shadow-pop);
}
.lc-menu--right{left:auto;right:0}
.lc-menu--up{bottom:auto;top:calc(100% + 8px)}
.lc-menu button{
 display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--devui-ai-radius-row);
 color:var(--devui-text);text-align:left;
}
.lc-menu button:hover,.lc-menu button:focus-visible{background:var(--devui-ai-hover)}
.lc-menu button>svg:first-child{flex:0 0 auto;color:var(--devui-aide-text)}
.lc-menu span{flex:1;min-width:0}
.lc-menu b{display:block;font-size:var(--devui-ai-fs-ui);font-weight:500}
.lc-menu em{display:block;font-style:normal;font-size:11px;line-height:16px;color:var(--devui-aide-text);margin-top:1px}

.lc-status{
 display:flex;align-items:center;gap:12px;padding:9px 13px 10px;
 font-family:var(--lmono);font-size:11px;color:var(--devui-aide-text);
}
.lc-status-item{display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-status-item>svg{flex:0 0 auto;opacity:.8}
.lc-status-btn{
 display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px;margin-left:-6px;border-radius:7px;
 font:inherit;color:inherit;white-space:nowrap;
}
.lc-status-btn:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.lc-meter b{font-weight:500;font-variant-numeric:tabular-nums}
.lc-ring{flex:0 0 auto;color:var(--devui-brand)}
.lc-status-note{font-family:var(--devui-ext-font-family);font-size:var(--devui-ai-fs-micro);white-space:nowrap}

/* ----------------------------------------------------------- 分区标题 */
.launch-sec{margin-top:40px}
.launch-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.launch-sec-head h2{margin:0;font-size:var(--devui-ai-fs-ui);line-height:20px;font-weight:400;color:var(--devui-aide-text);letter-spacing:.01em}

/* -------------------------------------------------------------- 专家行 */
.launch-rows{display:flex;flex-direction:column;gap:2px}
.launch-row{
 display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:9px 12px;
 border:1px solid transparent;border-radius:var(--devui-ai-radius-pill);text-align:left;
 transition:background 140ms var(--devui-ai-ease),border-color 140ms var(--devui-ai-ease);
}
.launch-row:hover,.launch-row:focus-visible{background:var(--devui-ai-card);border-color:var(--devui-ai-border-soft)}
.launch-row.on{background:var(--devui-ai-selected);border-color:var(--devui-ai-run-line)}
/* 专家头像：圆形底 + 项目内头像图片（assets/avatars），色相对应能力卡 */
.launch-avatar{
 position:relative;flex:0 0 auto;display:block;width:30px;height:30px;border-radius:50%;overflow:hidden;
 background:var(--av-bg);
}
.launch-avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 6%}
.launch-avatar--sm{width:20px;height:20px}
.launch-avatar i{
 position:absolute;inset:0;border-radius:50%;pointer-events:none;
 box-shadow:inset 0 0 0 1px var(--devui-ai-border-soft);
}
.launch-avatar.av-amber {--av-bg:#fbe8cf}
.launch-avatar.av-blue  {--av-bg:#dde8fd}
.launch-avatar.av-lime  {--av-bg:#eaf4cf}
.launch-avatar.av-sky   {--av-bg:#dcf0f8}
.launch-avatar.av-violet{--av-bg:#e9e1fd}
.launch-avatar.av-slate {--av-bg:#e5e5ea}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-amber {--av-bg:#3a2a13}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-blue  {--av-bg:#172545}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-lime  {--av-bg:#263019}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-sky   {--av-bg:#142e3a}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-violet{--av-bg:#28214d}
[data-theme="as2"][data-mode="dark"] .launch-avatar.av-slate {--av-bg:#2b2b33}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.launch-row-name{flex:0 0 auto;font-size:var(--devui-ai-fs-ui);font-weight:600;color:var(--devui-text)}
.launch-row-badge{
 flex:0 0 auto;height:17px;padding:0 5px;display:inline-flex;align-items:center;border-radius:4px;
 font-family:var(--lmono);font-size:10px;color:var(--devui-aide-text);background:var(--devui-ai-sunken);
}
.launch-row-prompt{
 flex:1;min-width:0;font-size:var(--devui-ai-fs-ui);color:var(--devui-text-weak);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.launch-row-go{
 flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
 font-size:var(--devui-ai-fs-micro);color:var(--devui-aide-text);opacity:0;transition:opacity 140ms var(--devui-ai-ease);
}
.launch-row:hover .launch-row-go,.launch-row:focus-visible .launch-row-go,.launch-row.on .launch-row-go{opacity:1}
.launch-row.on .launch-row-go{color:var(--devui-ai-selected-ink)}

/* ---------------------------------------------------------------- 灵感 */
.launch-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.launch-chips button{
 height:30px;padding:0 14px;border-radius:var(--devui-ai-radius-pill);
 font-size:var(--devui-ai-fs-ui);color:var(--devui-text-weak);
 border:1px solid var(--devui-ai-border-soft);background:transparent;
 transition:background 140ms var(--devui-ai-ease),color 140ms var(--devui-ai-ease),border-color 140ms var(--devui-ai-ease);
}
.launch-chips button:hover{background:var(--devui-ai-hover);color:var(--devui-text)}
.launch-chips button[aria-pressed="true"]{
 background:var(--devui-ai-sunken);border-color:transparent;color:var(--devui-text);font-weight:600;
}
.launch-gallery{
 display:grid;grid-auto-flow:column;grid-auto-columns:196px;gap:12px;
 overflow-x:auto;overscroll-behavior-x:contain;padding:2px 2px 10px;scroll-snap-type:x proximity;
}
.launch-gallery::-webkit-scrollbar{height:6px}
.launch-gallery::-webkit-scrollbar-thumb{background:var(--devui-ai-border-strong);border-radius:3px}
.launch-idea{
 scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
 padding:10px 10px 12px;text-align:left;
 border:1px solid var(--devui-ai-border-soft);border-radius:var(--devui-ai-radius-card);
 background:var(--devui-ai-card);
 transition:border-color 140ms var(--devui-ai-ease),transform 180ms var(--devui-ai-ease),box-shadow 180ms var(--devui-ai-ease);
}
.launch-idea:hover,.launch-idea:focus-visible{
 border-color:var(--devui-ai-border-strong);transform:translateY(-2px);
 box-shadow:0 12px 24px -18px rgba(16,12,36,.6);
}
.launch-idea-art{
 display:block;width:100%;aspect-ratio:120/72;margin-bottom:9px;border-radius:9px;overflow:hidden;
 background:var(--devui-ai-sunken);
 background-image:radial-gradient(var(--devui-ai-border-strong) 1px,transparent 1px);
 background-size:8px 8px;
}
.launch-idea-art svg{display:block;width:100%;height:100%}
.launch-idea-art .a-fill{fill:var(--devui-ai-card);stroke:var(--devui-ai-border-soft);stroke-width:1.4}
.launch-idea-art .a-line{stroke:var(--devui-ai-border-soft);stroke-width:1.4}
.launch-idea-art .a-dot{fill:var(--devui-ai-border-strong)}
.launch-idea-art .a-ink{fill:none;stroke:var(--devui-brand);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.launch-idea-art rect.a-ink{fill:var(--devui-ai-run-bg);stroke:var(--devui-brand);stroke-width:1.4}
.launch-idea-art .a-soft{fill:none;stroke:var(--devui-ai-border-strong);stroke-width:1.6;stroke-linecap:round}
.launch-idea-art rect.a-soft{fill:var(--devui-ai-sunken);stroke:var(--devui-ai-border-strong);stroke-width:1.2}
.launch-idea-cat{font-family:var(--lmono);font-size:10px;letter-spacing:.06em;color:var(--devui-aide-text)}
.launch-idea strong{font-size:var(--devui-ai-fs-ui);font-weight:600;color:var(--devui-text);line-height:20px}
.launch-idea em{font-style:normal;font-family:var(--lmono);font-size:10px;line-height:16px;color:var(--devui-aide-text)}

/* ------------------------------------------------------- 任务详情引用 */
.launch-task-context{border:1px solid var(--devui-ai-border-soft);border-radius:var(--devui-ai-radius-card);background:var(--devui-ai-card);padding:18px}
.launch-task-context dl{margin:12px 0;display:grid;gap:8px;font-size:var(--devui-ai-fs-ui)}
.launch-task-context dl>div{display:flex;gap:16px;align-items:baseline}
.launch-task-context dt{width:80px;flex:0 0 80px;color:var(--devui-aide-text)}
.launch-task-context dd{margin:0;overflow-wrap:anywhere;color:var(--devui-text)}
.launch-task-context code{font-family:var(--lmono);font-size:var(--devui-ai-fs-micro);color:var(--devui-aide-text)}
.launch-task-context p{font-size:var(--devui-ai-fs-micro);color:var(--devui-aide-text);margin:0}

/* ------------------------------------------------------------- 响应式 */
/* 卡组按「可用内容宽度」收缩：侧栏展开 / 收起都走同一套规则 */
@container launch (max-width:800px){
 .launch-deck{--dyk:.84;--vcut:20px;--tuck:48px}
 .launch-card{width:108px;margin:0 -16px}
 .launch-card.tone-blue{width:120px}
}
@container launch (max-width:640px){
 .launch-deck{--dyk:.7;--vcut:26px;--tuck:44px}
 .launch-card{width:96px;margin:0 -16px;padding-left:10px;padding-right:10px}
 .launch-card.tone-blue{width:106px}
 .launch-card-art{width:32px;height:34px}
 .launch-card-name,.launch-card.tone-blue .launch-card-name{font-size:12px;line-height:17px}
}
@container launch (max-width:540px){
 .launch-deck{--dyk:.54;--vcut:32px;--tuck:38px}
 .launch-card{width:86px;margin:0 -16px}
 .launch-card.tone-blue{width:94px}
 .launch-card-art{width:28px;height:30px}
 .launch-card-name,.launch-card.tone-blue .launch-card-name{font-size:11px;line-height:15px}
 .lc-status>.lc-status-item:first-of-type{display:none}
 .lc-status-note{display:none}
 .launch-row-prompt{display:none}
}
@container launch (max-width:430px){
 .launch-deck{--dyk:.42;--vcut:44px;--tuck:32px}
 .launch-card{width:74px;margin:0 -16px}
 .launch-card.tone-blue{width:80px}
 .launch-card-art{display:none}
}

@media(min-width:1500px){.task-launch-inner{padding-top:56px}}
@media(max-width:1180px){.task-launch-inner{padding:32px 28px 36px}}
@media(max-width:960px){.launch-ask{font-size:22px}}
@media(max-width:760px){
 .task-launch-inner{padding:22px 16px 28px}
 .launch-ask{font-size:20px;gap:2px 6px}
 .launch-project-btn{max-width:62vw}
 .launch-gallery{grid-auto-columns:168px}
 .launch-row-badge{display:none}
}
/* 矮窗口：压缩问候区，保证输入框和第一行专家同屏 */
@media(max-height:820px) and (min-width:960px){
 .task-launch-inner{padding-top:24px}
 .launch-hero{padding-top:6px}
 .launch-ask{font-size:24px}
 .launch-stack{margin-top:18px}
 .launch-deck{--vcut:14px}
 .lc-paper textarea{height:60px;min-height:60px}
 .launch-sec{margin-top:30px}
}

// 活跃日历数据：固定种子生成，工作日高于周末，含两段连续高活跃
const HEAT = (() => {
  let seed = 20260915;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const days = [];
  const today = new Date(2026, 8, 15);
  const start = new Date(today); start.setDate(start.getDate() - 125);
  // 对齐到周一
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const dow = (d.getDay() + 6) % 7;
    const weekend = dow >= 5;
    const idx = Math.round((d - start) / 86400000);
    const burst = (idx > 42 && idx < 58) || (idx > 92 && idx < 106) ? 2 : 0;
    let n = weekend ? Math.floor(rnd() * 3.4) : 1 + Math.floor(rnd() * 5.6);
    n += burst;
    if (rnd() < (weekend ? 0.22 : 0.04)) n = 0;
    days.push({ d: new Date(d), n: Math.min(n, 9) });
  }
  return days;
})();

function areaLine(vals, color) {
  const W = 96, H = 34, n = vals.length, max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const pts = vals.map((v, i) => [i * W / (n - 1), H - 3 - (v - min) / (max - min || 1) * (H - 8)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < n; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const id = 'al' + color.slice(1);
  const [lx, ly] = pts[n - 1];
  return `<svg class="kc-line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W},${H} L0,${H} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="2.2" fill="#fff" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}

function spark(vals, tone) {
  const cols = vals.length, rows = 5, W = 76;
  const dx = W / cols, dy = 5.4, H = rows * dy;
  const r = Math.min(1.7, dx / 2 - 0.55);
  const max = Math.max(...vals, 1);
  let out = '';
  vals.forEach((v, i) => {
    const on = v ? Math.max(1, Math.round(v / max * rows)) : 0;
    for (let j = 0; j < rows; j++) {
      const lit = j < on, last = i === cols - 1;
      const sz = (lit ? r : r * 0.62) * 2;
      out += `<rect x="${(i * dx + dx / 2 - sz / 2).toFixed(2)}" y="${(H - j * dy - dy / 2 - sz / 2).toFixed(2)}"
        width="${sz.toFixed(2)}" height="${sz.toFixed(2)}" rx=".3" fill="var(--${tone}-solid)"
        opacity="${lit ? (last ? 1 : .6) : .16}"/>`;
    }
  });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${out}</svg>`;
}

// 双序列点阵折线：交付趋势。曲线本身是等距圆点，下方用点阵代替面积填充
function trend(days, a, b) {
  const w = 560, h = 150, pad = 22, base = h - 26, max = Math.max(...a, ...b, 1);
  const X = i => pad + i * ((w - pad * 2) / (days.length - 1));
  const Y = v => base - (v / max) * (h - 52);
  const path = vals => vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const ticks = [0, Math.ceil(max / 2), max];

  // 面积改为点阵场：每 12px 一列，从基线向上排到曲线高度
  const step = 12, dy = 10;
  let field = '';
  for (let x = pad; x <= w - pad; x += step) {
    const t = (x - pad) / ((w - pad * 2) / (days.length - 1));
    const i0 = Math.min(Math.floor(t), a.length - 2), f = t - i0;
    const yv = Y(a[i0] + (a[i0 + 1] - a[i0]) * f);
    for (let y = base - dy / 2; y > yv; y -= dy) {
      field += `<rect x="${x - 1.3}" y="${(y - 1.3).toFixed(1)}" width="2.6" height="2.6" fill="var(--done-solid)"
        opacity="${(0.1 + 0.2 * (1 - (base - y) / (base - yv + .001))).toFixed(2)}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="trend">
    ${ticks.map(t => `<g><line x1="${pad}" x2="${w - pad}" y1="${Y(t)}" y2="${Y(t)}"
      stroke="var(--border-subtle)" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="1.8 4.4"/>
      <text x="${pad - 6}" y="${Y(t) + 4}" text-anchor="end" class="ax">${t}</text></g>`).join('')}
    ${field}
    <path d="${path(b)}" fill="none" stroke="var(--wait-solid)" stroke-width="2"
      stroke-linecap="butt" stroke-dasharray="2 3.6" opacity=".7"/>
    <path d="${path(a)}" fill="none" stroke="var(--done-solid)" stroke-width="2.3"
      stroke-linecap="butt" stroke-dasharray="2.3 2.7"/>
    ${days.map((d, i) => i % 3 === 0
      ? `<text x="${X(i)}" y="${h - 8}" text-anchor="middle" class="ax">${d.getMonth() + 1}/${d.getDate()}</text>` : '').join('')}
    ${a.map((v, i) => `<rect x="${(X(i) - 2.5).toFixed(1)}" y="${(Y(v) - 2.5).toFixed(1)}" width="5" height="5" rx=".6" fill="var(--done-solid)"><title>${d2(days[i])} 已接受 ${v}</title></rect>`).join('')}
  </svg>`;
}

function buildTrace(tid) {
  if(T(tid)?.launchConfig)return null;
  const f = FLOW[tid]; if (!f) return null;
  let sd = tid.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7) & 0x7fffffff;
  const r = () => (sd = (sd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const steps = []; let t0 = 0, llm = 0, tool = 0, tok = 0, err = 0;
  const push = (kind, label, extra) => {
    const dur = extra.dur != null ? extra.dur : +(0.6 + r() * 4.2).toFixed(2);
    const st = t0; t0 += dur;
    steps.push(Object.assign({ kind, label, start: +st.toFixed(2), dur }, extra));
  };
  [['pre', f.pre], ['post', f.post || []]].forEach(([seg, list]) => {
    list.forEach((x, i) => {
      if (x[0] === 'say' || x[0] === 'think') {
        const inTok = 900 + Math.floor(r() * 2600), outTok = 60 + Math.floor(r() * 420);
        llm++; tok += inTok + outTok;
        push('assistant', x[1], { model: MODELS[llm % MODELS.length], inTok, outTok,
          ttft: +(0.4 + r() * 1.6).toFixed(2), think: x[0] === 'think' });
      } else if (x[0] === 'tools') {
        x[2].forEach(([n, v]) => {
          if (n === '已思考') {
            const inTok = 700 + Math.floor(r() * 1800), outTok = 40 + Math.floor(r() * 260);
            llm++; tok += inTok + outTok;
            push('assistant', v, { model: MODELS[llm % MODELS.length], inTok, outTok,
              ttft: +(0.3 + r() * 1.1).toFixed(2), think: true });
          } else { tool++; push('tool', n, { arg: v, ok: true }); }
        });
      } else if (x[0] === 'sub') {
        const running = x[3] === 'run';
        if (!running) llm += 3; tool += 2;
        const inTok = 4200 + Math.floor(r() * 5200), outTok = 300 + Math.floor(r() * 900);
        tok += inTok + outTok;
        push('sub', x[1] + ' · ' + x[2], { agent: x[1], work: x[2], running,
          inTok, outTok, dur: running ? 0 : parseFloat(x[4]) || 60 });
      }
    });
  });
  const t = T(tid);
  if (t && t.st === 'fail') { err = 1; push('error', '连接器鉴权过期，拉取构建记录失败', { dur: 0.4 }); }
  return { steps, llm, tool, err, tok, dur: t0,
    cost: +(tok / 1000 * 0.012).toFixed(4) };
}

const MON = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function heatmap() {
  // 按周切列
  const weeks = [];
  for (let i = 0; i < HEAT.length; i += 7) weeks.push(HEAT.slice(i, i + 7));
  // 月份标签：某周的周一进入新月份时打标
  let lastM = -1;
  const labels = weeks.map(w => {
    const m = w[0].d.getMonth();
    if (m !== lastM) { lastM = m; return MON[m]; }
    return '';
  });
  const total = HEAT.reduce((a, x) => a + x.n, 0);
  const active = HEAT.filter(x => x.n > 0).length;
  // 最长连续活跃
  let best = 0, cur = 0;
  HEAT.forEach(x => { cur = x.n > 0 ? cur + 1 : 0; if (cur > best) best = cur; });

  return `<div class="card heat-wrap">
    <div class="heat-scroll scroll">
      <div class="heat-grid">
        <div class="heat-months">${labels.map(l => `<span>${l}</span>`).join('')}</div>
        <div class="heat-dows">${['一', '', '三', '', '五', '', '日'].map(d => `<span>${d}</span>`).join('')}</div>
        <div class="heat-cols">
          ${weeks.map(w => `<div class="heat-col">${w.map(x => {
            const ds = `${x.d.getMonth() + 1}月${x.d.getDate()}日`;
            return `<i class="heat-cell" style="background:var(--heat-${heatLv(x.n)})" title="${ds} · ${x.n ? x.n + ' 个任务完成' : '无活动'}"></i>`;
          }).join('')}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="heat-foot">
      <span>近 18 周共完成 <b>${total}</b> 个任务</span>
      <span class="sepdot">·</span>
      <span><b>${active}</b> 天有产出</span>
      <span class="sepdot">·</span>
      <span>最长连续 <b>${best}</b> 天</span>
    </div>
  </div>`;
}

function stream(t) {
  const out = [];
  out.push(`<div class="msg me">
    ${av('我', 'c2')}
    <div class="body">
      <div class="who">${t.trigger.startsWith('自动化') ? '自动化发起' : '我'}<span class="ts">${esc(t.trigger)}</span></div>
      <div class="txt">${esc(t.title)}</div>
    </div>
  </div>`);

  if(t.launchConfig){const c=t.launchConfig;out.push(`<div class="launch-task-context"><div class="t-13" style="font-weight:600">构建配置</div><dl>${c.localProject?`<div><dt>本地工程</dt><dd>${esc(c.localProject)} · ${esc(c.localFileCount)} 个文件</dd></div>`:''}${c.workspace?`<div><dt>工作空间</dt><dd>${esc(c.workspace)}</dd></div>`:''}<div><dt>能力入口</dt><dd>${esc(c.typeName)}</dd></div><div><dt>执行环境</dt><dd>${esc(c.target)}</dd></div><div><dt>模型 / 模式</dt><dd>${esc(c.stack)}</dd></div><div><dt>执行专家</dt><dd>${esc(c.expertName)} <code>${esc(c.expertId)}</code></dd></div></dl><p>配置已记录。此原型不执行真实构建。</p></div>`);}

  if (FLOW[t.id]) out.push(flowBlock(t, 'pre'));

  // 介入卡 / 决定后的结果消息
  if (t.intervene) {
    const d = DATA.rt.decided[t.id];
    if (d === undefined) out.push(interveneCard(t));
    else {
      const o = t.intervene.opts[d];
      out.push(`<div class="msg">
        ${av('我', 'c2')}
        <div class="body">
          <div class="who">你的决定<span class="ts">刚刚</span></div>
          <div class="txt">${esc(t.intervene.lead)}「<b>${esc(o[0])}</b>」。</div>
          <div class="banner done" style="margin-top:10px">
            ${ic('check', 16)}
            <div style="flex:1">
              <div class="t-13" style="font-weight:600">已按这个决定继续</div>
              <div class="t-12" style="opacity:.86;margin-top:2px">${esc(t.intervene.after)}</div>
            </div>
          </div>
        </div>
      </div>`);
    }
  }

  // 决定之后的执行过程接在决定消息之后
  if (FLOW[t.id] && (!t.intervene || DATA.rt.decided[t.id] !== undefined)) out.push(flowBlock(t, 'post'));

  if (t.st === 'fail') {
    out.push(`<div class="icard fail">
      <div class="icard-h">
        <span class="chip fail"><i class="d"></i>任务失败</span>
        <span class="t-11 ter mono">2 小时前</span>
      </div>
      <div class="icard-b">
        <div class="icard-q">连接器「CodeArts 流水线」鉴权过期，拿不到当日构建记录</div>
        <div class="t-13 sec">复盘初稿的时间线章节依赖构建记录，缺这段会让结论无法核实，所以我停下来而不是先写一版。</div>
        <div class="scope">影响：本任务 1 个章节 · 同时影响自动化 A-04 的后续每次运行</div>
        <div class="opts">
          <button class="opt" data-act="toast" data-v="已跳转连接器设置：重新授权后可从「拉取构建记录」阶段续跑，前面阶段不重做">
            <span class="rad"></span><span><span class="ot">去重新授权连接器</span><span class="od">授权后从失败阶段续跑，已完成阶段不重做</span></span></button>
          <button class="opt" data-act="toast" data-v="已改为不含构建记录的版本，该章节会标注「证据缺失」">
            <span class="rad"></span><span><span class="ot">先出不含构建记录的版本</span><span class="od">该章节标注「证据缺失」，不伪装成完整复盘</span></span></button>
        </div>
        <div class="icard-f">
          <button class="btn sm ter" data-act="toast" data-v="已中止该任务，工作线保留，可随时恢复">中止任务</button>
        </div>
      </div>
    </div>`);
  }

  if (t.st === 'run' && t.log) {
    out.push(`<div class="msg">
      ${av('码', 'c1')}
      <div class="body">
        <div class="who">代码实现搭档<span class="ts">正在运行</span></div>
        <div class="txt">改动已完成，正在跑构建校验。全部通过后会自动生成变更评审。</div>
        <div class="codebox" style="margin-top:10px;max-width:640px">
          <div class="code-h">${ic('term', 13)}<span class="pth">构建校验 · fix/board-first-paint</span>
            <span class="chip run"><i class="d"></i>3/5</span></div>
          <div style="padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:20px;color:var(--text-2)">
            ${t.log.map(l => `<div${l.startsWith('  ') ? ' style="color:var(--text-3)"' : ''}>${esc(l)}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>`);
  }

  if (t.st === 'verify') {
    const V = t.lead || (t.kind === 'code'
      ? [['码', 'c1'], '代码实现搭档', '依赖图与冲突风险计算已完成，6 个文件变更。测试与浏览器验证都过了，流水线还在排队 —— 右侧可以逐项看证据，流水线回传前「接受」不会放开。']
      : [['文', 'c4'], '文书成稿搭档', '已按你的决定成稿，右侧可以逐段看改了什么、每条结论的出处在哪。没过的验证项全部通过前，「接受」不会放开。']);
    out.push(`<div class="msg">
      ${av(V[0][0], V[0][1])}
      <div class="body">
        <div class="who">${V[1]}<span class="ts">${t.ts}</span></div>
        <div class="txt">${V[2]}</div>
      </div>
    </div>`);
  }

  if (t.st === 'done') {
    out.push(`<div class="msg">
      ${av('我', 'c2')}
      <div class="body">

  }

  return out.join('');
}

function flowBlock(t, seg) {
  const f = FLOW[t.id];
  if (!f) return '';
  const steps = f[seg] || [];
  if (!steps.length) return '';
  return `<div class="flow">${steps.map((st, i) => {
    const key = t.id + ':' + seg + ':' + i;
    if (st[0] === 'say') return `<div class="fsay">${esc(st[1])}</div>`;
    if (st[0] === 'think') return `<div class="fthink">${esc(st[1])}</div>`;
    if (st[0] === 'sub') {
      const [, agent, work, state, dur, tone] = st;
      return `<div class="fsub">
        <span class="orb ${tone} ${state === 'run' ? 'run' : ''}"></span>
        <span class="nm" style="font-weight:500;color:var(--text-1)">${esc(agent)}</span>
        <span class="sep">·</span><span>${esc(work)}</span>
        <span class="sep">·</span><span>子 Agent ${state === 'run' ? '运行中' : '已完成'}</span>
        <span class="st">${esc(dur)}</span>
      </div>`;
    }
    return `<div data-aui-flow="${esc(key)}"></div>`;
  }).join('')}</div>`;
}

function timeline(t) {
  const stages = t.stages.map((s, i) => {
    let st = s[0];
    if (t.intervene && DATA.rt.decided[t.id] !== undefined) {
      const [a, b] = t.intervene.advance;
      if (i === a) st = 'done';
      if (i === b) st = 'run';
    }
    return [st, s[1], s[2]];
  });
  const doneN = stages.filter(s => s[0] === 'done').length;
  return `<div class="tl">
    <div class="tl-h" data-act="tl">
      ${ic(DATA.rt.tlOpen ? 'chevd' : 'chev', 14, 'ter')}
      <span class="t-13" style="font-weight:600">执行阶段</span>
      <span class="t-12 ter">${doneN}/${stages.length} 已完成</span>
      <div style="flex:1"></div>
      <span class="t-11 ter">总览 · 详细过程见下方对话流</span>
    </div>
    ${DATA.rt.tlOpen ? `<div class="tl-b">${stages.map(([st, n, d]) => `
      <div class="stage-row">
        <span class="stage-ico ${st}">${st === 'done' ? ic('check', 10) : st === 'run' ? '›' : st === 'fail' ? '!' : ''}</span>
        <div class="stage-tx">
          <div style="font-weight:${st === 'run' ? 600 : 400}">${esc(n)}</div>
          <div class="sub">${esc(d)}</div>
        </div>
      </div>`).join('')}</div>` : ''}
  </div>`;
}

function rProgress(t) {
  const stages = t.stages.map((stage,index) => {
    let state=stage[0]; if(t.intervene && DATA.rt.decided[t.id] !== undefined){if(index===t.intervene.advance[0])state='done';if(index===t.intervene.advance[1])state='run';}
    return [state,stage[1],stage[2]];
  });
  return `<div class="progress-rail"><details open><summary>执行进度<span>${stages.filter(x=>x[0]==='done').length}/${stages.length}</span></summary><ol class="progress-steps">${stages.map(([state,name,description])=>`<li class="${state}"><span class="progress-dot">${ic(state==='done'?'check':state==='run'?'clock':'more',12)}</span><details><summary>${esc(name)}<span>${state==='done'?'已完成':state==='run'?'进行中':state==='fail'?'失败':'待开始'}</span></summary><p>${esc(description)}</p></details></li>`).join('')}</ol></details>
    <details open><summary>任务产物<span>${t.arts.length}</span></summary>${t.arts.length?t.arts.map((a,index)=>`<button class="progress-output" data-act="openart" data-v="${t.id}|${index}">${ic(a.t==='code'?'code':'doc',18)}<span><b>${esc(a.n)}</b><small>${a.st==='verify'?'待验证':'已验证'}</small></span>${ic('chev',12)}</button>`).join(''):'<p class="t-12 ter">产物生成后会显示在这里</p>'}</details>
    <details open><summary>本次任务上下文</summary><div class="progress-context"><span>${ic('nav-workspace',14)}工作空间</span><button data-act="workspace" data-v="${t.proj}">${esc(P(t.proj).label)}</button></div><div class="progress-context"><span>${ic('bot',14)}协作搭档</span>${avs(t.team)}</div><div class="progress-context"><span>${ic('monitor',14)}执行环境</span><span>${P(t.proj).env==='cloud'?'云端沙箱':'本地'}</span></div></details></div>`;
}

function domR(t) {

  return `<div class="dom-r" style="flex-basis:${S.domRW}px;width:${S.domRW}px">
    <div class="tabs">
      ${tabs.map(([k, n, c]) => `<button class="tab ${S.rTab === k ? 'on' : ''}" data-act="rtab" data-v="${k}">${n}${c ? `<span class="cn">${c}</span>` : ''}</button>`).join('')}
      <div style="flex:1"></div>
      <button class="iconbtn tip" data-act="rfull" data-tip="${S.rFull ? '退出全屏' : '全屏查看'}">${ic(S.rFull ? 'shrink' : 'expand', 14)}</button>

        <div style="flex:1"><div class="t-13" style="font-weight:600">已接受并归档</div>
        <div class="t-12" style="opacity:.86;margin-top:2px">任务状态回写为已完成，工作线已排入合入队列。</div></div></div>` : `
      <div class="accept-hint">${ic(canAccept ? 'check' : 'alert', 14)}
        <span>${canAccept ? '全部验证已通过，可以接受。' : `还差 ${t.ev.filter(e => e[0] === 'pend').length} 项验证：${t.ev.filter(e => e[0] === 'pend').map(e => e[1]).join('、')}。未满足前不能接受。`}</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn acc" style="flex:1" data-act="accept" ${canAccept ? '' : 'disabled'}>${ic('check', 14)}接受并归档</button>
        <button class="btn sec" data-act="toast" data-v="已退回：请填写退回原因，系统会据此开启下一次运行">退回</button>
        ${canAccept ? '' : `<button class="btn sec" data-act="runev">${ic('play', 13)}跑验证</button>`}
      </div>`}
    </div>` : ''}
  </div>`;
}

function rArt(t) {
  if (!t.arts.length) return `<div class="empty">${ic('doc', 28)}<div class="t-13">还没有产物</div>
    <div class="t-12">搭档完成当前阶段后，产物会出现在这里，并带上验证证据。</div></div>`;
  const icoOf = { doc: ['doc', 'f-doc'], data: ['board', 'f-data'], code: ['code', 'f-source'], media: ['camera', 'f-media'] };
  return t.arts.map((a, ai) => {
    const [i, c] = icoOf[a.t] || ['doc', 'f-doc'];
    return `<div class="art ${S.artIdx === ai ? 'hit' : ''}" data-act="rtab" data-v="${a.t === 'code' || a.t === 'doc' ? 'diff' : 'ev'}">
      <div class="art-h">
        <span class="art-ico" style="color:var(--${c})">${ic(i, 18)}</span>
        <div style="flex:1;min-width:0">
          <div class="art-n">${esc(a.n)}</div>
          <div class="art-m">${a.m.map(x => `<span>${esc(x)}</span>`).join('<span style="opacity:.5">·</span>')}</div>
        </div>
        ${a.st === 'verify' ? '<span class="chip wait"><i class="d"></i>待验证</span>' : '<span class="chip done"><i class="d"></i>已验证</span>'}
      </div>
      ${a.prev ? `<div class="art-prev mono">${esc(a.prev)}</div>` : `
      <div class="shot"><svg viewBox="0 0 320 120" style="width:100%;height:auto;display:block">
        <rect width="320" height="120" fill="var(--surface-2)"/>
        <rect x="14" y="14" width="80" height="8" rx="4" fill="var(--a-300)"/>
        <circle cx="54" cy="58" r="7" fill="var(--run-solid)"/><circle cx="130" cy="86" r="7" fill="var(--wait-solid)"/>
        <circle cx="206" cy="58" r="7" fill="var(--done-solid)"/><circle cx="266" cy="86" r="7" fill="var(--g-500)"/>
        <path d="M54 58 130 86M130 86 206 58M206 58 266 86" stroke="var(--g-400)" stroke-width="2" fill="none"/>
      </svg></div>`}
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn sm sec" data-act="rtab" data-v="diff">${ic('pr', 13)}看变更</button>
        <button class="btn sm ter" data-act="toast" data-v="已复制产物直达链接">${ic('link', 13)}复制链接</button>
        <button class="btn sm ter" data-act="toast" data-v="已下载到本地目录">下载</button>
      </div>
    </div>`;
  }).join('');
}

function rDiff(t) {
  if (t.diffDoc) return docDiff(t);
  if (!t.files) return `<div class="empty">${ic('code', 28)}<div class="t-13">当前阶段还没有变更</div></div>`;
  return `
  <div style="margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span class="t-h14" style="flex:1">${t.files.length} 个文件</span>
      <span class="stat"><span class="p">+${t.files.reduce((a, f) => a + f[2], 0)}</span><span class="m">−${t.files.reduce((a, f) => a + f[3], 0)}</span></span>
    </div>
    ${t.files.map((f, i) => `<div class="filerow ${i === 0 ? 'on' : ''}">
      <span class="gs ${f[0]}">${f[0]}</span>
      <span style="color:var(--${f[1].endsWith('.css') ? 'f-style' : f[1].endsWith('.ts') || f[1].endsWith('.tsx') ? 'f-source' : 'f-doc'})">${ic('doc', 14)}</span>
      <span class="fn">${esc(f[1])}</span>
      <span class="stat"><span class="p">+${f[2]}</span><span class="m">−${f[3]}</span></span>
    </div>`).join('')}
  </div>
  <div class="codebox">
    <div class="code-h">
      <span style="color:var(--f-source)">${ic('code', 14)}</span>
      <span class="pth">src/board/conflict.ts</span>
      <span class="tag mono">TypeScript</span>
      <button class="iconbtn" data-act="toast" data-v="已复制文件内容">${ic('link', 13)}</button>
    </div>
    <div style="padding:6px 0 6px 26px">
      ${codeLines()}
    </div>
  </div>
  ${DATA.rt.cmts.map(c => `<div class="cmtitem">
    <div style="display:flex;gap:8px;align-items:center">
      ${av('我', 'c2', 20)}
      <span class="t-13" style="font-weight:600;flex:1">我 · 第 ${c.line} 行</span>
      <span class="chip run"><i class="d"></i>已回灌</span>
    </div>
    <div class="t-13 sec" style="margin-top:6px">${esc(c.text)}</div>
    <div class="t-12 ter" style="margin-top:8px;display:flex;gap:6px;align-items:center">
      ${ic('spark', 13)}代码实现搭档已收到，正在按此意见修改
    </div>
  </div>`).join('')}
  ${S.cmtLine !== null ? `<div class="cmtbox">
    <div class="t-12 ter">对第 ${S.cmtLine} 行提出意见 — 提交后直接回灌给搭档，不需要你自己改</div>
    <textarea id="cmtIn" placeholder="例如：这里的阈值写死了 0.4，应该按文件体积加权…"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn sm acc" data-act="cmtOk">提交并回灌</button>
      <button class="btn sm ter" data-act="cmtCancel">取消</button>
    </div>
  </div>` : ''}`;
}

function codeLines() {
  const L = [
    ['hunk', '@@', '@@ -12,6 +12,28 @@ export function laneRisk('],
    ['', '12', '<span class="k">export function</span> laneRisk(a: Lane, b: Lane) {'],
    ['del', '13', '  <span class="k">return</span> a.files.some(f => b.files.includes(f))'],
    ['add', '13', '  <span class="c">// 文件重叠不等于冲突：按改动密度加权</span>'],
    ['add', '14', '  <span class="k">const</span> shared = a.files.filter(f => b.files.includes(f))'],
    ['add', '15', '  <span class="k">if</span> (shared.length === <span class="n">0</span>) <span class="k">return</span> <span class="s">\'lo\'</span>'],
    ['add', '16', '  <span class="k">const</span> w = shared.reduce((s, f) => s + density(a, f) * density(b, f), <span class="n">0</span>)'],
    ['add', '17', '  <span class="k">return</span> w > <span class="n">0.4</span> ? <span class="s">\'hi\'</span> : <span class="s">\'mid\'</span>'],
    ['', '18', '}']
  ];
  return L.map(([t, n, c]) =>
    `<div class="dl ${t}"><span class="ln">${n}</span><span class="ct">${t === 'hunk' ? esc(c) : c}${t !== 'hunk' ? `<button class="cmt-add" data-act="cmt" data-v="${n}">+</button>` : ''}</span></div>`
  ).join('');
}

function rTrace(t) {
  const tr = trace(t.id);
  if (!tr) return `<div class="empty">${ic('graph', 28)}<div class="t-13">这条任务还没有可观测轨迹</div>
    <div class="t-12">任务开始执行后，每一次模型调用与工具调用都会记录在这里</div></div>`;
  const fmtD = v => v >= 60 ? `${Math.floor(v / 60)}m ${Math.round(v % 60)}s` : `${v.toFixed(1)}s`;
  const KIND_L = { assistant: '模型', tool: '工具', sub: '子 Agent', error: '错误' };
  const maxD = Math.max(...tr.steps.map(x => x.dur), 1);
  const cnt = k => tr.steps.filter(x => x.kind === k).length;
  const filters = [['all', '全部', tr.steps.length], ['assistant', '模型', cnt('assistant')],
                   ['tool', '工具', cnt('tool')], ['sub', '子 Agent', cnt('sub')]];
  // 过滤只作用于下方列表；上方泳道始终是完整时间线，否则就读不出间隔了
  const rows = tr.steps.map((x, i) => [x, i]).filter(([x]) => S.trF === 'all' || x.kind === S.trF);
  const sel = S.trStep !== null ? tr.steps[S.trStep] : null;

  // 详情：窄面板下行内展开，产物面板放大后改为右侧定栏
  const detail = (x) => `
    <div class="kv"><span>来源</span><b class="mono">Step ${tr.steps.indexOf(x) + 1} / ${tr.steps.length}</b></div>
    ${x.kind === 'assistant' ? `
      <div class="kv"><span>模型</span><b>${x.model}</b></div>
      <div class="kv"><span>状态</span><b>已完成</b></div>
      <div class="kv"><span>Token 合计</span><b>${(x.inTok + x.outTok).toLocaleString()}</b></div>
      <div class="kv"><span style="padding-left:10px">输入</span><b>${x.inTok.toLocaleString()}</b></div>
      <div class="kv"><span style="padding-left:10px">输出</span><b>${x.outTok.toLocaleString()}</b></div>
      <div class="tr-sec">请求时序</div>
      <div class="kv"><span>起点</span><b class="mono">${x.start}s</b></div>
      <div class="kv"><span>总耗时</span><b class="mono">${x.dur.toFixed(2)} s</b></div>
      <div class="kv"><span>首字延迟</span><b class="mono">${x.ttft} s</b></div>
      <div class="kv"><span>吞吐</span><b class="mono">${(x.outTok / Math.max(x.dur - x.ttft, .3)).toFixed(1)} tok/s</b></div>
      ${x.think ? `<div class="tr-note">${ic('spark', 12)}这一步是判断，不改任何文件</div>` : ''}`
    : x.kind === 'tool' ? `
      <div class="kv"><span>状态</span><b style="color:var(--done-tx)">成功</b></div>
      <div class="kv"><span>入参</span><b class="mono" style="font-size:11px">${esc(x.arg)}</b></div>
      <div class="tr-sec">请求时序</div>
      <div class="kv"><span>起止</span><b class="mono">${x.start}s → ${(x.start + x.dur).toFixed(2)}s</b></div>
      <div class="kv"><span>总耗时</span><b class="mono">${x.dur.toFixed(2)} s</b></div>
      <div class="tr-note">${ic('info', 12)}工具调用不计入模型 Token</div>`
    : x.kind === 'sub' ? `
      <div class="kv"><span>搭档</span><b>${esc(x.agent)}</b></div>
      <div class="kv"><span>工作</span><b>${esc(x.work)}</b></div>
      <div class="kv"><span>状态</span><b style="color:var(--${x.running ? 'run' : 'done'}-tx)">${x.running ? '运行中' : '已完成'}</b></div>
      <div class="kv"><span>Token 合计</span><b>${(x.inTok + x.outTok).toLocaleString()}</b></div>
      <div class="tr-sec">请求时序</div>
      <div class="kv"><span>总耗时</span><b class="mono">${x.dur.toFixed(2)} s</b></div>
      <div class="tr-note">${ic('info', 12)}子 Agent 有自己的独立上下文，不占用主线窗口</div>`
    : `
      <div class="kv"><span>状态</span><b style="color:var(--fail-tx)">失败</b></div>
      <div class="tr-note" style="color:var(--fail-tx)">${ic('alert', 12)}已在对话流中抛出介入卡，等待你决定</div>`}`;

  return `<div data-aui-trace></div>
  <div class="tr-top">
    <div class="tr-f">
      ${filters.map(([k, n, c]) => `<button class="${S.trF === k ? 'on' : ''}" data-act="trf" data-v="${k}">${n}<i>${c}</i></button>`).join('')}
    </div>
    <div class="tr-srch">${ic('search', 12)}<span>搜索步骤</span></div>
  </div>

  <div class="tr-strip">
    ${['输入', '模型', '工具'].map((row, ri) => `
      <div class="tr-srow">
        <span class="tr-sl">${row}</span>
        <div class="tr-sc">
          ${tr.steps.map((x, i) => {
            const hit = (ri === 0 && i === 0) || (ri === 1 && (x.kind === 'assistant' || x.kind === 'sub'))
              || (ri === 2 && (x.kind === 'tool' || x.kind === 'error'));
            return `<i class="tr-b ${hit ? 'hit' : ''} ${S.trStep === i ? 'on' : ''} k-${x.kind}"
              style="opacity:${hit ? (0.45 + 0.55 * (x.dur / maxD)).toFixed(2) : ''}"
              data-act="trstep" data-v="${i}" title="${esc(x.label.slice(0, 40))} · ${fmtD(x.dur)}"></i>`;
          }).join('')}
        </div>
      </div>`).join('')}
    <div class="tr-axis"><span>0.0s</span><div style="flex:1"></div><span>${fmtD(tr.dur)}</span></div>
  </div>

  <div class="tr-sum">
    <span><b>${fmtD(tr.dur)}</b> 耗时</span><span class="sepdot">·</span>
    <span><b>${(tr.tok / 1000).toFixed(1)}k</b> tok</span><span class="sepdot">·</span>
    <span><b>¥${tr.cost}</b></span><span class="sepdot">·</span>
    <span><b>${tr.llm}</b> 模型</span><span class="sepdot">·</span>
    <span><b>${tr.tool}</b> 工具</span><span class="sepdot">·</span>
    <span class="${tr.err ? 'bad' : ''}"><b>${tr.err}</b> 错误</span>
  </div>

  <div class="tr-wrap">
    <div class="tr-list">
      ${rows.length ? rows.map(([x, i]) => `
        <div class="tr-item k-${x.kind} ${S.trStep === i ? 'on' : ''}">
          <button class="tr-row" data-act="trstep" data-v="${i}">
            <i class="tr-dot"></i>
            <span class="tr-k">${KIND_L[x.kind]}</span>
            <span class="tr-t">${esc(x.label)}</span>
            <span class="tr-d">${fmtD(x.dur)}</span>
          </button>
          ${S.trStep === i && !S.rFull ? `<div class="tr-detail">${detail(x)}</div>` : ''}
        </div>`).join('') : '<div class="tr-empty">这一类下没有步骤</div>'}
    </div>
    ${S.rFull && sel ? `
      <div class="tr-pane">
        <div class="tr-pane-h">
          <span class="tr-k">${KIND_L[sel.kind]}</span>
          <span class="t-12 ter" style="flex:1">Step ${S.trStep + 1}</span>
          <button class="iconbtn" data-act="trstep" data-v="${S.trStep}">${ic('x', 13)}</button>
        </div>
        <div class="t-13" style="margin-bottom:8px">${esc(sel.label)}</div>
        ${detail(sel)}
      </div>` : ''}
  </div>
  <div class="note" style="margin-top:12px">
    ${ic('info', 12)} 点任意一步看它的模型、Token 与时序${S.rFull ? '' : '；放大产物面板后详情会移到右侧定栏'}
  </div>`;
}

  S.toast = msg; render();

}

document.addEventListener('click', e => {
  if (e.target.closest('.rz')) return;
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  const a = el ? el.dataset.act : null, v = el ? el.dataset.v : null;

  // 个人中心：点面板以外的任何位置都收起（包括没有绑定动作的空白区域）
  // 这一步必须在「无动作则 return」之前，否则点空白处永远收不起来
  if (S.acct && a !== 'acct' && a !== 'theme' && !e.target.closest('.acctp')) {
    S.acct = false;
    if (!el) { render(); return; }
  }
  if (S.autoMenu && a !== 'amenu' && !e.target.closest('.menu')) {
    S.autoMenu = null;
    if (!el) { render(); return; }
  }
  if (!el) return;

  // 点在弹窗内部不应触发遮罩的关闭；点 X 按钮本身则放行
  if (a === 'close' && stop && el !== e.target.closest('[data-act="close"]')) return;
  if (a === 'close' && stop && el.classList.contains('mask')) return;

  switch (a) {
    case 'mode':
      if (S.mode === v) return;
      S.mode = v; S.projF = 'all'; S.reviewId = null;
      S.projOpen = new Set([(modeProjects()[0] || {}).n].filter(Boolean));
      S.exCat = v === 'code' ? '软件开发' : '全部';
      S.newCat = 0; S.newTpl = null;
      if (S.page === 'review' || S.page === 'task') S.page = 'home';
      break;
    case 'theme': S.theme = S.theme === 'light' ? 'dark' : 'light'; break;
    case 'toggleRail': S.railOpen = !S.railOpen; break;
    case 'toggleR': S.rOpen = !S.rOpen; if (!S.rOpen) S.rFull = false; break;
    case 'toggleL': S.lOpen = !S.lOpen; break;
    case 'rfull': S.rFull = !S.rFull; break;
    case 'connFilter': S.connFilter=v; break;
    case 'connReset': S.connFilter='all';S.connQuery='';break;
    case 'connDetail': S.connDetail=S.connDetail===v?null:v;break;
    case 'connToggle': { const x=DATA.connGroups.flatMap(g=>g[1]).find(x=>x.n===v); x.st=x.st==='ok'?'off':'ok'; x.meta=x.st==='ok'?'已连接 · 可用于任务':'未连接'; break; }
    case 'workspace': S.wsItem=null; S.wsManage=false; S.workspaceId = v; S.workspaceTab = 'overview'; S.page = 'workspace'; break;
    case 'workspaceTab': S.workspaceTab = v; break;
    case 'wsSystem': S.wsSystem=v;S.wsItem=null;break;
    case 'wsView': S.wsView=v;break;
    case 'wsFilter': S.wsFilter=v;S.wsItem=null;break;
    case 'wsItem': S.wsItem=S.wsItem===v?null:v;break;
    case 'wsManage': S.wsManage=!S.wsManage;break;
    case 'wsConnect': {const list=S.wsConnections[S.workspaceId];const i=list.indexOf(v);if(i<0)list.push(v);else list.splice(i,1);S.wsItem=null;break;}
    case 'workspaceSave': { const name = document.getElementById('workspaceName').value.trim(); if (!name) { toast('请输入工作空间名称'); return; } const p = P(S.workspaceId); p.label = name; p.d = document.getElementById('workspaceDescription').value.trim(); toast('工作空间设置已保存'); return; }

    }
    case 'decide': {
      const t = T(S.taskId);
      DATA.rt.decided[t.id] = +v;
      DATA.rt.evPassed[t.id] = true;
      t.st = 'verify';
      t.now = t.intervene.thenNow;
      toast('决定已记录，任务从「等待判断」回到「运行中」');
      return;
    }
    case 'accept':
      DATA.rt.accepted[S.taskId] = true;
      T(S.taskId).st = 'done';
      T(S.taskId).now = '已接受并归档，工作线进入合入队列';
      toast('已接受并归档 · 工作线已按依赖顺序排入合入队列');
      return;
    case 'runev':
      DATA.rt.evPassed[S.taskId] = true;
      toast('验证已跑完，全部通过 —— 「接受」已放开');
      return;
    case 'cmt': S.cmtLine = v; break;
    case 'cmtCancel': S.cmtLine = null; break;
    case 'cmtOk': {
      const ta = document.getElementById('cmtIn');
      const txt = (ta && ta.value.trim()) || '这里的阈值写死了，应该按改动密度加权，并补一条对应的测试。';
      DATA.rt.cmts.push({ line: S.cmtLine, text: txt });
      S.cmtLine = null;
      toast('评论已回灌给搭档 —— 由它改，不需要你自己动手');
      return;
    }
    case 'sw': {
      const au = DATA.autos.find(x => x.id === v); au.on = !au.on;
      toast(au.on ? `已启用「${au.n}」` : `已停用「${au.n}」，历史运行记录保留`);
      return;
    }
    case 'toast': toast(v); return;
    case 'noop': return;
    default: return;
  }
  render();
});

// 面板拖拽：过程中只改 DOM 宽度，松手才写回状态 —— 避免每移动一像素就整页重渲染
document.addEventListener('pointerdown', e => {
  const rz = e.target.closest('.rz');
  if (!rz) return;
  const el = document.querySelector(rz.dataset.target);
  if (!el) return;
  const key = rz.dataset.rz;
  const off = +(rz.dataset.off || 0);
  const inv = rz.dataset.inv === '1';      // 右侧面板：往左拖是变宽
  const min = +rz.dataset.min, max = +rz.dataset.max;
  const x0 = e.clientX, w0 = el.getBoundingClientRect().width;
  rz.classList.add('dragging');
  document.body.classList.add('rzing');
  rz.setPointerCapture(e.pointerId);
  let w = w0;
  const move = ev => {
    const d = (ev.clientX - x0) * (inv ? -1 : 1);
    w = Math.max(min, Math.min(max, w0 + d));
    el.style.flexBasis = w + 'px';
    el.style.width = w + 'px';
  };
  const up = () => {
    rz.removeEventListener('pointermove', move);
    rz.removeEventListener('pointerup', up);
    rz.removeEventListener('pointercancel', up);
    rz.classList.remove('dragging');
    document.body.classList.remove('rzing');
    S[key] = Math.round(w - off);          // 写回状态，下次渲染沿用
  };
  rz.addEventListener('pointermove', move);
  rz.addEventListener('pointerup', up);
  rz.addEventListener('pointercancel', up);
  e.preventDefault();
});

// 输入只写状态、不重渲染，保证任何一次重绘都不会冲掉已输入的目标
document.addEventListener('input', e => {
  if(e.target.id==='connSearch'){const pos=e.target.selectionStart;S.connQuery=e.target.value;render();const input=document.getElementById('connSearch');input.focus();return;}
  const k = e.target.dataset && e.target.dataset.sync;
  if (!k) return;
  S[k] = e.target.value;
  // 只切按钮可用态，不重渲染 —— 否则每敲一个字都会重建 DOM、光标丢失
  document.querySelectorAll('.wb-send').forEach(b => { b.disabled = !S.goal.trim(); });
});


document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.acct) { S.acct = false; render(); }
    else if (S.dialog) { S.dialog = null; render(); }
    else if (S.cmtLine !== null) { S.cmtLine = null; render(); }
  }
});

function positionRailPopover(event) {
  const wrap=event.target.closest?.('.rail-popover-wrap');
  if(!wrap)return;
  const panel=wrap.querySelector('.rail-popover');
  const box=wrap.getBoundingClientRect();
  panel.style.left=(box.right+8)+'px';
  panel.style.top=Math.max(8,Math.min(box.top,window.innerHeight-panel.offsetHeight-12))+'px';
}
document.addEventListener('pointerover',positionRailPopover);
document.addEventListener('focusin',positionRailPopover);
window.addEventListener('hashchange',()=>{if(location.hash === '#new-task'){S.page='new';render();}});
render();
</script>

/* Colors and motion as variables \u2013 override them on .ui-buttonc (see Theming in the docs) */
.ui-buttonc {
  --ui-btnc-title: #000;
  --ui-btnc-ink: rgba(0, 0, 0, 0.88);
  --ui-btnc-muted: rgba(0, 0, 0, 0.61);
  --ui-btnc-icon: rgba(0, 0, 0, 0.447);
  --ui-btnc-solid: rgba(0, 0, 0, 0.88);
  --ui-btnc-solid-hover: rgba(0, 0, 0, 0.8);
  --ui-btnc-on-solid: #fcfcfc;
  --ui-btnc-surface: #ffffff;
  --ui-btnc-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 1px -1px rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --ui-btnc-shadow-hover: 0 0 0 0.5px rgba(0, 0, 0, 0.1), 0 1px 1px -1px rgba(0, 0, 0, 0.12), 0 1px 3px 0 rgba(0, 0, 0, 0.07);
  --ui-btnc-wash: rgba(0, 0, 0, 0.03);
  --ui-btnc-danger: #e5484d;
  --ui-btnc-danger-bg: rgba(229, 72, 77, 0.08);
  --ui-btnc-danger-bg-hover: rgba(229, 72, 77, 0.12);
  --ui-btnc-shine: rgba(255, 255, 255, 0.82);
  --ui-btnc-shine-on-solid: #ffffff;
  --ui-btnc-focus: rgba(0, 96, 226, 0.35);
  --ui-btnc-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ui-btnc-load: 650ms;

  --h: 28px;
  --px: 10px;
  --gap: 6px;
  --fs: 13px;
  --lh: 20px;
  --icon: 16px;
  --radius: 6px;

  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  box-sizing: border-box;
  height: var(--h);
  padding: 0 var(--px);
  margin: 0;
  border: 0;
  border-radius: var(--radius);
  font-family: "Inter", "InterVariable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: var(--fs);
  font-weight: 500;
  line-height: var(--lh);
  letter-spacing: 0;
  max-width: 100%;
  min-width: 0;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  transition:
    background-color 140ms ease,
    color 140ms ease,
    box-shadow 140ms ease,
    transform 160ms var(--ui-btnc-ease),
    opacity 140ms ease;
}

/* Sizes: 24 \xB7 28 \xB7 32 high */
.ui-buttonc[data-size="sm"] {
  --h: 24px;
  --px: 8px;
  --gap: 4px;
  --fs: 12px;
  --lh: 16px;
  --icon: 14px;
  --radius: 6px;
}
.ui-buttonc[data-size="lg"] {
  --h: 32px;
  --px: 12px;
  --gap: 6px;
  --fs: 13px;
  --icon: 16px;
  --radius: 6px;
}
/* An icon sits closer to the edge than the text, so both look evenly spaced */
.ui-buttonc[data-icon-left] {
  padding-left: calc(var(--px) - 2px);
}
.ui-buttonc[data-icon-right] {
  padding-right: calc(var(--px) - 2px);
}
.ui-buttonc[data-icon-only] {
  width: var(--h);
  padding: 0;
}

/* primary: a dark chip */
.ui-buttonc[data-variant="primary"] {
  background: var(--ui-btnc-solid);
  color: var(--ui-btnc-on-solid);
}
.ui-buttonc[data-variant="primary"]:hover:not(:disabled) {
  background: var(--ui-btnc-solid-hover);
}

/* secondary: white with the card's hairline shadow */
.ui-buttonc[data-variant="secondary"] {
  background: var(--ui-btnc-surface);
  color: var(--ui-btnc-title);
  box-shadow: var(--ui-btnc-shadow);
}
.ui-buttonc[data-variant="secondary"] .ui-buttonc__icon {
  color: var(--ui-btnc-icon);
}
.ui-buttonc[data-variant="secondary"]:hover:not(:disabled) {
  box-shadow: var(--ui-btnc-shadow-hover);
}

/* ghost: a muted label, a soft wash appears on hover */
.ui-buttonc[data-variant="ghost"] {
  background: transparent;
  color: var(--ui-btnc-muted);
}
.ui-buttonc[data-variant="ghost"] .ui-buttonc__icon {
  color: var(--ui-btnc-icon);
}
.ui-buttonc[data-variant="ghost"]:hover:not(:disabled) {
  background: var(--ui-btnc-wash);
  color: var(--ui-btnc-ink);
}
.ui-buttonc[data-variant="ghost"]:hover:not(:disabled) .ui-buttonc__icon {
  color: var(--ui-btnc-ink);
}

/* destructive: red label on a minimal red fill, no stroke */
.ui-buttonc[data-variant="destructive"] {
  background: var(--ui-btnc-danger-bg);
  color: var(--ui-btnc-danger);
}
.ui-buttonc[data-variant="destructive"]:hover:not(:disabled) {
  background: var(--ui-btnc-danger-bg-hover);
}

.ui-buttonc .ui-buttonc__icon {
  transition: color 140ms ease;
}
.ui-buttonc:active:not(:disabled):not([data-loading]) {
  transform: scale(0.97);
}
.ui-buttonc:focus-visible {
  outline: 2px solid var(--ui-btnc-focus);
  outline-offset: 1px;
}
.ui-buttonc:disabled {
  opacity: 0.4;
  cursor: default;
}
.ui-buttonc[data-loading] {
  cursor: default;
}

.ui-buttonc__icon {
  display: grid;
  place-items: center;
  flex: none;
  width: var(--icon);
  height: var(--icon);
}
.ui-buttonc__icon {
  overflow: hidden;
}
.ui-buttonc__icon > svg,
.ui-buttonc__icon > img {
  display: block;
  width: 100%;
  height: 100%;
}
.ui-buttonc__icon > img {
  object-fit: contain;
}

/* Morph: the button clips while its width glides; changed parts blur in */
.ui-buttonc {
  overflow: clip;
}
.ui-buttonc[data-ready] .ui-buttonc__label {
  animation: ui-buttonc-label-in 480ms cubic-bezier(0.25, 1, 0.5, 1) both;
}
.ui-buttonc[data-ready] .ui-buttonc__icon {
  animation: ui-buttonc-icon-in 520ms cubic-bezier(0.25, 1, 0.5, 1) both;
}

/* Loading: a light band sweeps across a copy of the dimmed label */
/* A label too long for its parent ends in "\u2026" \u2013 the full text shows on hover */
.ui-buttonc__label {
  position: relative;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ui-buttonc__label::after {
  content: attr(data-text);
  content: attr(data-text) / "";
  position: absolute;
  inset: 0;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(90deg, transparent 38%, var(--ui-btnc-shine) 50%, transparent 62%) 100% 0 / 300% 100%
    no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  opacity: 0;
  pointer-events: none;
}
.ui-buttonc[data-variant="primary"] .ui-buttonc__label::after {
  --ui-btnc-shine: var(--ui-btnc-shine-on-solid);
}
.ui-buttonc[data-loading] .ui-buttonc__label {
  color: color-mix(in srgb, currentColor 50%, transparent);
}
.ui-buttonc[data-loading] .ui-buttonc__label::after {
  opacity: 1;
  animation: ui-buttonc-sweep calc(var(--ui-btnc-load) * 1.6) linear infinite;
}
.ui-buttonc__spinner {
  animation: ui-buttonc-spin 900ms linear infinite;
}

@keyframes ui-buttonc-label-in {
  from {
    opacity: 0;
    filter: blur(3px);
    transform: translateY(25%);
  }
}
@keyframes ui-buttonc-icon-in {
  from {
    opacity: 0;
    filter: blur(2px);
    transform: scale(0.7);
  }
}

@keyframes ui-buttonc-spin {
  to {
    transform: rotate(1turn);
  }
}

@keyframes ui-buttonc-sweep {
  from {
    background-position: 100% 0;
  }
  to {
    background-position: 0% 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ui-buttonc[data-ready] .ui-buttonc__label,
  .ui-buttonc[data-ready] .ui-buttonc__icon {
    animation: none;
  }
  .ui-buttonc {
    transition-duration: 1ms;
  }
  .ui-buttonc[data-loading] .ui-buttonc__label::after {
    animation: none;
    opacity: 0;
  }
}

/* Dark mode: follows a .dark class or data-theme="dark" on any ancestor, e.g. <html> */
:where(.dark, [data-theme="dark"]) .ui-buttonc {
  /* primary inverts: a light chip with dark text */
  --ui-btnc-solid: rgba(255, 255, 255, 0.9);
  --ui-btnc-solid-hover: rgba(255, 255, 255, 0.82);
  --ui-btnc-on-solid: #161618;
  --ui-btnc-shine-on-solid: #ffffff;

  --ui-btnc-title: rgba(255, 255, 255, 0.9);
  --ui-btnc-ink: rgba(255, 255, 255, 0.9);
  --ui-btnc-muted: rgba(255, 255, 255, 0.62);
  --ui-btnc-icon: rgba(255, 255, 255, 0.5);
  --ui-btnc-surface: #1c1c1e;
  --ui-btnc-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --ui-btnc-shadow-hover: 0 0 0 0.5px rgba(255, 255, 255, 0.16), 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --ui-btnc-wash: rgba(255, 255, 255, 0.06);
  --ui-btnc-danger: #ff6369;
  --ui-btnc-danger-bg: rgba(229, 72, 77, 0.14);
  --ui-btnc-danger-bg-hover: rgba(229, 72, 77, 0.2);
  --ui-btnc-shine: #ffffff;
  --ui-btnc-focus: rgba(77, 141, 255, 0.5);
}

/* Animatable custom properties: the equal segment width and the soft edges glide too */
@property --ui-segc-min { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --ui-segc-fade-l { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --ui-segc-fade-r { syntax: "<length>"; inherits: false; initial-value: 0px; }

.ui-segc {
  --ui-segc-ink: rgba(0, 0, 0, 0.88);
  --ui-segc-text: rgba(0, 0, 0, 0.61);
  --ui-segc-hover-text: rgba(0, 0, 0, 0.75);
  --ui-segc-line: rgba(0, 0, 0, 0.06);
  --ui-segc-wash: rgba(0, 0, 0, 0.03);
  --ui-segc-fill: rgba(0, 0, 0, 0.06);
  --ui-segc-track: rgba(0, 0, 0, 0.04);
  --ui-segc-card: #ffffff;
  --ui-segc-card-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.06), 0 1px 1px -1px rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --ui-segc-accent: rgba(0, 96, 226, 0.765);
  --ui-segc-accent-soft: rgba(0, 96, 226, 0.08);
  --ui-segc-focus: rgba(0, 96, 226, 0.35);
  --ui-segc-ease: cubic-bezier(0.25, 0.9, 0.3, 1);
  /* Size: md \u2013 28px chips, 4px 10px */
  --ui-segc-h: 28px;
  --ui-segc-px: 10px;
  --ui-segc-fs: 13px;
  --ui-segc-lh: 20px;
  --ui-segc-icon: 16px;
  --ui-segc-gap: 8px;
  --ui-segc-pad: 2px;
  --ui-segc-ring: 3px;
  box-sizing: border-box;
  display: inline-flex;
  max-width: 100%;
  min-width: 0;
  vertical-align: middle;
  border-radius: 8px;
  font-family: "Inter", "InterVariable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: var(--ui-segc-fs);
  font-weight: 500;
  line-height: var(--ui-segc-lh);
  color: var(--ui-segc-text);
  -webkit-font-smoothing: antialiased;
}
.ui-segc[data-size="sm"] { --ui-segc-h: 24px; --ui-segc-px: 8px; --ui-segc-fs: 12px; --ui-segc-lh: 16px; --ui-segc-icon: 14px; --ui-segc-gap: 6px; }
.ui-segc[data-size="lg"] { --ui-segc-h: 32px; --ui-segc-px: 12px; --ui-segc-icon: 16px; --ui-segc-gap: 8px; }
.ui-segc[data-full] { display: flex; width: 100%; }
.ui-segc[data-disabled] { opacity: 0.5; pointer-events: none; }
.ui-segc *, .ui-segc *::before, .ui-segc *::after { box-sizing: border-box; }
:where(.ui-segc) button { margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
:where(.ui-segc) svg { display: block; flex: none; }

/* Scrolls sideways only when it doesn't fit; the padding keeps focus rings from being cut off */
.ui-segc__scroller {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding: var(--ui-segc-pad);
  border-radius: inherit;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--ui-segc-fade-l), #000 calc(100% - var(--ui-segc-fade-r)), transparent);
  mask-image: linear-gradient(to right, transparent, #000 var(--ui-segc-fade-l), #000 calc(100% - var(--ui-segc-fade-r)), transparent);
  transition: --ui-segc-fade-l 160ms ease, --ui-segc-fade-r 160ms ease;
}
.ui-segc__scroller::-webkit-scrollbar { display: none; }

.ui-segc__track {
  position: relative;
  display: flex;
  width: max-content;
  min-width: 100%;
  /* Horizontal drags move the indicator; vertical ones still scroll the page */
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
/* When it scrolls, swipes scroll it instead of dragging the indicator */
.ui-segc[data-overflow] .ui-segc__track { touch-action: pan-x pan-y; }
/* Equal segments, each as wide as the widest one needs */
.ui-segc[data-full] .ui-segc__track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(var(--ui-segc-min), 1fr); }
.ui-segc[data-ready] .ui-segc__track { transition: --ui-segc-min 200ms var(--ui-segc-ease); }

/* An option */
.ui-segc__opt {
  position: relative;
  z-index: 1;
  display: flex;
  flex: none;
  align-items: center;
  justify-content: center;
  height: var(--ui-segc-h);
  padding: 0 var(--ui-segc-px);
  overflow: clip;
  border-radius: 6px;
  white-space: nowrap;
  /* Hover washes are short and crisp, in and out */
  transition: color 90ms ease, background-color 90ms ease;
}
.ui-segc[data-ready]:not([data-full]) .ui-segc__opt { transition: color 90ms ease, background-color 90ms ease, width 200ms var(--ui-segc-ease); }
.ui-segc__opt[data-active] { color: var(--ui-segc-ink); }
.ui-segc__opt:disabled { opacity: 0.4; cursor: not-allowed; }
.ui-segc__opt:focus-visible { outline: 2px solid var(--ui-segc-focus); outline-offset: 1px; }
@media (hover: hover) {
  .ui-segc__opt:not([data-active]):not(:disabled):hover { background-color: var(--ui-segc-wash); }
}

.ui-segc__content { display: inline-flex; flex: none; align-items: center; gap: 6px; }
.ui-segc[data-size="sm"] .ui-segc__content { gap: 5px; }
.ui-segc__icon { display: grid; place-items: center; width: var(--ui-segc-icon); height: var(--ui-segc-icon); color: rgba(0, 0, 0, 0.447); transition: color 90ms ease; }
.ui-segc__opt[data-active] .ui-segc__icon { color: var(--ui-segc-ink); }
.ui-segc__icon svg, .ui-segc__icon img { width: 100%; height: 100%; }
/* Images fill the tile without leaving it, whatever their shape */
.ui-segc__icon { overflow: hidden; }
.ui-segc__icon img { display: block; object-fit: contain; }
.ui-segc__label { display: block; }

.ui-segc__count {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 5px;
  background: var(--ui-segc-fill);
  font-size: 11px;
  line-height: 16px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ui-segc-text);
  animation: ui-segc-in 200ms var(--ui-segc-ease) both;
}
